
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #080d18;
}

body {
  min-height: 100dvh;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 45%, #142642 0%, #0d192d 45%, #080d18 100%);
  color: #dce8fa;
  font-family: 'Quicksand', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
}

#returnButton, #restartButton {
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  padding: 9px 15px;
  border: 1px solid rgba(180,210,255,.2);
  border-radius: 50px;
  background: rgba(15,28,50,.65);
  color: #dce8fa;
  font: 11px 'Quicksand', sans-serif;
  letter-spacing: 1.5px;
  cursor: pointer;
  z-index: 5;
}

#returnButton {
  left: 16px;
}

#restartButton {
  right: 16px;
}

#returnButton:active, #restartButton:active {
  background: rgba(65,105,165,.4);
}

.game {
  width: min(100%, 440px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.message {
  min-height: 29px;
  width: 100%;
  text-align: center;
  color: #b9d3ff;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(17px, 4.5vw, 22px);
  letter-spacing: .7px;
  opacity: 0;
  transition: opacity .45s ease, text-shadow .45s ease;
  text-shadow: 0 0 5px rgba(143,193,255,.1);
}

.message.visible {
  opacity: .92;
  animation: gentleGlow 3.2s ease-in-out infinite;
}

@keyframes gentleGlow {
  0%, 100% {
    text-shadow: 0 0 5px rgba(143,193,255,.13);
    opacity: .78;
  }
  50% {
    text-shadow: 0 0 12px rgba(143,193,255,.34);
    opacity: 1;
  }
}

.progress-track {
  width: 100%;
  height: 2px;
  overflow: hidden;
  border-radius: 10px;
  background: rgba(137,178,239,.15);
  box-shadow: 0 0 10px rgba(82,139,220,.08);
  margin-top: -12px;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #527dbd, #8fc1ff);
  box-shadow: 0 0 9px rgba(119,174,255,.5);
  transition: width .55s ease;
}

.board-wrap {
  width: min(88vw, 390px);
  aspect-ratio: 1;
  position: relative;
  padding: 10px;
  border: 1px solid rgba(180,210,255,.13);
  border-radius: 17px;
  background: rgba(14,25,44,.35);
  box-shadow: 0 15px 45px rgba(0,0,0,.16), inset 0 0 22px rgba(130,175,255,.025);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#board {
  width: 100%;
  height: 100%;
  display: grid;
  position: relative;
  gap: 0;
  touch-action: none;
}

.cell {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell::after {
  content: "";
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(153,190,243,.12);
}

.endpoint {
  position: relative;
  z-index: 2;
  width: 42%;
  height: 42%;
  min-width: 11px;
  min-height: 11px;
  max-width: 24px;
  max-height: 24px;
  border-radius: 50%;
  border: 2px solid var(--color);
  background: var(--color);
  box-shadow: 0 0 8px color-mix(in srgb, var(--color) 35%, transparent);
}

.endpoint::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: rgba(8,13,24,.24);
}

#lines {
  position: absolute;
  inset: 10px;
  width: calc(100% - 20px);
  height: calc(100% - 20px);
  overflow: visible;
  pointer-events: none;
  z-index: 1;
}

.path-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: .64;
  opacity: .88;
  filter: drop-shadow(0 0 1.3px currentColor);
}

.path-line.preview {
  opacity: .8;
  stroke-dasharray: .12 .1;
}

#win {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(3,7,17,.76);
  backdrop-filter: blur(8px);
}

#win.show {
  display: flex;
}

.win-inner {
  width: min(100%, 300px);
  padding: 28px 20px;
  text-align: center;
  border: 1px solid rgba(180,210,255,.23);
  border-radius: 22px;
  background: rgba(14,25,44,.97);
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

#winTitle {
  margin-bottom: 20px;
  color: #e1ecff;
  font: 500 34px 'Cormorant Garamond', serif;
  letter-spacing: 2px;
}

#nextButton {
  padding: 10px 23px;
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 50px;
  background: rgba(45,76,122,.55);
  color: #e0eaff;
  font: 12px 'Quicksand', sans-serif;
  letter-spacing: 2px;
}

@media (max-width: 420px) {
  .game { gap: 17px; }
  .board-wrap { width: min(88vw, 360px); padding: 8px; }
  #lines { inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); }
}

@media (prefers-reduced-motion: reduce) {
  .message.visible { animation: none; }
  .progress-fill { transition: none; }
}
</style>
</head>

<body>

<button id="returnButton" type="button">return</button>
<button id="restartButton" type="button">restart</button>

<main class="game">
  <div class="message" id="message">almostt, you need to connect everything</div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div id="board"></div>
    <svg id="lines" viewBox="0 0 5 5" preserveAspectRatio="none"></svg>
  </div>
</main>

<div id="win">
  <div class="win-inner">
    <h2 id="winTitle">YAY</h2>
    <button id="nextButton" type="button">next</button>
  </div>
</div>

<script>
  
(() => {
  const TOTAL_LEVELS = 10;
  const REWARD_KEY = "birthday_unlocked_rewards";
  const PROGRESS_KEY = "colormatch_completed_levels";
  const RETURN_PAGE = "index.html";

  const palette = [
    "#ff668a",
    "#69c8ff",
    "#b18aff",
    "#ffd166",
    "#62dfbd",
    "#ff9c66",
    "#f28ce5",
    "#8ca8ff"
  ];

  const board = document.getElementById("board");
  const boardWrap = document.getElementById("boardWrap");
  const svg = document.getElementById("lines");
  const message = document.getElementById("message");
  const progressFill = document.getElementById("progressFill");
  const win = document.getElementById("win");
  const winTitle = document.getElementById("winTitle");
  const nextButton = document.getElementById("nextButton");

  let completed = Math.max(
    0,
    Number(localStorage.getItem(PROGRESS_KEY)) || 0
  );

  let level = Math.min(completed + 1, TOTAL_LEVELS);
  let size = 5;
  let paths = [];
  let endpoints = new Map();
  let drawing = null;
  let occupied = new Map();
  let locked = false;
  let messageTimer = null;

  function saveReward() {
    try {
      const rewards = JSON.parse(
        localStorage.getItem(REWARD_KEY) || "[]"
      );

      if (Array.isArray(rewards) && !rewards.includes("picrews")) {
        rewards.push("picrews");
        localStorage.setItem(REWARD_KEY, JSON.stringify(rewards));
      }
    } catch {
      localStorage.setItem(REWARD_KEY, JSON.stringify(["picrews"]));
    }
  }

  function showMessage() {
    message.classList.remove("visible");
    void message.offsetWidth;
    message.classList.add("visible");

    clearTimeout(messageTimer);
    messageTimer = setTimeout(() => {
      message.classList.remove("visible");
    }, 3000);
  }

  function updateProgress() {
    progressFill.style.width =
      `${Math.min(completed / TOTAL_LEVELS, 1) * 100}%`;
  }

  function makeSolution() {
    size = level <= 4 ? 5 : 6;

    const snake = [];

    for (let row = 0; row < size; row++) {
      if (row % 2 === 0) {
        for (let col = 0; col < size; col++) {
          snake.push(row * size + col);
        }
      } else {
        for (let col = size - 1; col >= 0; col--) {
          snake.push(row * size + col);
        }
      }
    }

    const colorCount = Math.min(
      3 + Math.floor((level - 1) / 2),
      6,
      Math.floor((size * size) / 4)
    );

    const cuts = [];
    const remaining = snake.length;
    let cursor = 0;

    for (let i = 0; i < colorCount; i++) {
      const leftColors = colorCount - i;
      const leftCells = remaining - cursor;
      let chunkLength;

      if (i === colorCount - 1) {
        chunkLength = leftCells;
      } else {
        const minLength = 2;
        const maxLength = leftCells - (leftColors - 1) * minLength;
        chunkLength = Math.max(
          minLength,
          Math.floor(leftCells / leftColors)
        );
        chunkLength = Math.min(chunkLength, maxLength);
      }

      cuts.push(snake.slice(cursor, cursor + chunkLength));
      cursor += chunkLength;
    }

    paths = cuts.map((cells, index) => ({
      index,
      color: palette[index],
      start: cells[0],
      end: cells[cells.length - 1],
      solution: cells,
      cells: [],
      complete: false
    }));

    endpoints = new Map();

    paths.forEach(path => {
      endpoints.set(path.start, {
        pathIndex: path.index,
        color: path.color
      });

      endpoints.set(path.end, {
        pathIndex: path.index,
        color: path.color
      });
    });
  }

  function renderBoard() {
    board.innerHTML = "";
    board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    board.style.gridTemplateRows = `repeat(${size}, 1fr)`;

    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);

    for (let index = 0; index < size * size; index++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.index = index;

      if (endpoints.has(index)) {
        const endpoint = endpoints.get(index);
        const dot = document.createElement("div");
        dot.className = "endpoint";
        dot.style.setProperty("--color", endpoint.color);
        cell.appendChild(dot);
      }

      board.appendChild(cell);
    }

    renderLines();
  }

  function renderLines() {
    svg.innerHTML = "";

    paths.forEach(path => {
      if (path.cells.length < 2) return;

      const points = path.cells.map(index => {
        const row = Math.floor(index / size);
        const col = index % size;
        return `${col + 0.5},${row + 0.5}`;
      });

      const line = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "polyline"
      );

      line.setAttribute("points", points.join(" "));
      line.setAttribute("stroke", path.color);
      line.setAttribute("class", "path-line");
      line.style.color = path.color;

      svg.appendChild(line);
    });

    if (drawing && drawing.cells.length > 1) {
      const points = drawing.cells.map(index => {
        const row = Math.floor(index / size);
        const col = index % size;
        return `${col + 0.5},${row + 0.5}`;
      });

      const line = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "polyline"
      );

      line.setAttribute("points", points.join(" "));
      line.setAttribute("stroke", drawing.color);
      line.setAttribute("class", "path-line preview");
      line.style.color = drawing.color;
      svg.appendChild(line);
    }
  }

  function rebuildOccupied() {
    occupied = new Map();

    paths.forEach(path => {
      path.cells.forEach(cell => occupied.set(cell, path.index));
    });
  }

  function cellFromPointer(event) {
    const rect = board.getBoundingClientRect();
    const col = Math.floor((event.clientX - rect.left) / rect.width * size);
    const row = Math.floor((event.clientY - rect.top) / rect.height * size);

    if (row < 0 || col < 0 || row >= size || col >= size) {
      return null;
    }

    return row * size + col;
  }

  function adjacent(a, b) {
    const rowA = Math.floor(a / size);
    const colA = a % size;
    const rowB = Math.floor(b / size);
    const colB = b % size;

    return Math.abs(rowA - rowB) + Math.abs(colA - colB) === 1;
  }

  function beginDrawing(cell) {
    const endpoint = endpoints.get(cell);
    if (!endpoint) return false;

    const path = paths[endpoint.pathIndex];

    if (path.complete) {
      path.complete = false;
      path.cells = [];
      rebuildOccupied();
    }

    paths.forEach(other => {
      if (other.index === path.index) {
        other.complete = false;
        other.cells = [];
      }
    });

    drawing = {
      pathIndex: path.index,
      color: path.color,
      start: cell,
      cells: [cell]
    };

    rebuildOccupied();
    renderLines();
    return true;
  }

  function extendDrawing(target) {
    if (!drawing || target === null) return;

    const current = drawing.cells[drawing.cells.length - 1];

    if (target === current) return;

    if (drawing.cells.includes(target)) {
      const position = drawing.cells.indexOf(target);
      drawing.cells = drawing.cells.slice(0, position + 1);
      renderLines();
      return;
    }

    if (!adjacent(current, target)) return;

    const endpoint = endpoints.get(target);

    if (endpoint && endpoint.pathIndex !== drawing.pathIndex) {
      return;
    }

    const otherOwner = occupied.get(target);

    if (otherOwner !== undefined && otherOwner !== drawing.pathIndex) {
      return;
    }

    drawing.cells.push(target);

    if (endpoint && endpoint.pathIndex === drawing.pathIndex) {
      const path = paths[drawing.pathIndex];
      const correctEnd = target === path.start || target === path.end;

      if (correctEnd && target !== drawing.start) {
        path.cells = [...drawing.cells];
        path.complete = true;
        drawing = null;
        rebuildOccupied();
        renderLines();
        checkComplete();
        return;
      }
    }

    renderLines();
  }

  function finishDrawing() {
    if (!drawing) return;

    const path = paths[drawing.pathIndex];
    const last = drawing.cells[drawing.cells.length - 1];

    if (last === path.start || last === path.end) {
      path.cells = [...drawing.cells];
      path.complete = true;
      rebuildOccupied();
      drawing = null;
      renderLines();
      checkComplete();
      return;
    }

    drawing = null;
    renderLines();
  }

  function allCellsCovered() {
    const filled = new Set();

    paths.forEach(path => {
      if (path.complete) {
        path.cells.forEach(cell => filled.add(cell));
      }
    });

    return filled.size === size * size;
  }

  function checkComplete() {
    const allConnected = paths.every(path => path.complete);

    if (allConnected && allCellsCovered()) {
      winLevel();
    } else if (allConnected) {
      showMessage();
    }
  }

  function winLevel() {
    locked = true;
    completed = Math.max(completed, level);
    localStorage.setItem(PROGRESS_KEY, String(completed));
    updateProgress();

    if (completed >= TOTAL_LEVELS) {
      saveReward();
      winTitle.textContent = "YAY ♡";
      nextButton.textContent = "finish";
    } else {
      winTitle.textContent = "YAY";
      nextButton.textContent = "next";
    }

    win.classList.add("show");
  }

  function startLevel() {
    locked = false;
    drawing = null;
    win.classList.remove("show");
    message.classList.remove("visible");

    makeSolution();
    rebuildOccupied();
    renderBoard();
    updateProgress();
  }

  boardWrap.addEventListener("pointerdown", event => {
    if (locked) return;

    const cell = cellFromPointer(event);
    if (cell === null) return;

    const endpoint = endpoints.get(cell);

    if (endpoint) {
      event.preventDefault();
      boardWrap.setPointerCapture(event.pointerId);
      beginDrawing(cell);
    } else if (drawing) {
      extendDrawing(cell);
    }
  });

  boardWrap.addEventListener("pointermove", event => {
    if (locked || !drawing) return;

    const target = cellFromPointer(event);
    if (target === null) return;

    let current = drawing.cells[drawing.cells.length - 1];

    while (current !== target) {
      const row = Math.floor(current / size);
      const col = current % size;
      const targetRow = Math.floor(target / size);
      const targetCol = target % size;

      let next;

      if (col !== targetCol) {
        next = current + (targetCol > col ? 1 : -1);
      } else if (row !== targetRow) {
        next = current + (targetRow > row ? size : -size);
      } else {
        break;
      }

      if (!adjacent(current, next)) break;

      const oldLength = drawing.cells.length;
      extendDrawing(next);

      if (!drawing) return;
      if (drawing.cells.length === oldLength) break;

      current = drawing.cells[drawing.cells.length - 1];
    }
  });

  boardWrap.addEventListener("pointerup", finishDrawing);
  boardWrap.addEventListener("pointercancel", finishDrawing);

  document.getElementById("restartButton").addEventListener("click", () => {
    startLevel();
  });

  document.getElementById("returnButton").addEventListener("click", () => {
    window.location.href = RETURN_PAGE;
  });

  nextButton.addEventListener("click", () => {
    win.classList.remove("show");

    if (completed >= TOTAL_LEVELS) {
      window.location.href = RETURN_PAGE;
      return;
    }

    level = Math.min(level + 1, TOTAL_LEVELS);
    startLevel();
  });

  startLevel();
})();
</script>
</body>
</html>
