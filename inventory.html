<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>♡ inventory</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@300;400;500&display=swap');

*{box-sizing:border-box}

:root{
  --bg:#080d18;
  --blue:#91caff;
  --muted:#8798b3;
  --line:rgba(151,190,255,.16);
}

body{
  margin:0;
  min-height:100vh;
  color:#e5edff;
  font-family:'Quicksand',sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%,#172b49 0%,transparent 55%),
    radial-gradient(ellipse at 0% 100%,#101b31 0%,transparent 45%),
    var(--bg);
}

button{font:inherit}

header{
  text-align:center;
  padding:48px 20px 28px;
}

.symbol{
  color:var(--blue);
  font-size:17px;
  letter-spacing:12px;
  margin-bottom:15px;
  opacity:.8;
}

h1{
  font-family:'Cormorant Garamond',serif;
  font-size:42px;
  font-weight:400;
  letter-spacing:3px;
  margin:0;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  letter-spacing:3px;
  margin-top:10px;
}

main{
  width:min(900px,92%);
  margin:0 auto 60px;
}

section{
  margin:24px 0;
  padding:23px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(17,29,49,.55);
  box-shadow:0 12px 45px #00000018;
  backdrop-filter:blur(12px);
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}

h2{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;
  font-size:27px;
  margin:0;
  letter-spacing:1px;
}

.status{
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.5px;
  text-align:right;
}

.progress{
  height:2px;
  background:#ffffff10;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:22px;
}

.progress-fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#739bff,#b7ddff);
  box-shadow:0 0 12px #91caff88;
  transition:width .5s ease;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
}

.item{
  position:relative;
  aspect-ratio:3/4;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:12px;
  background:linear-gradient(145deg,#172943,#0b1322);
  cursor:pointer;
  transition:transform .25s,border-color .25s;
}

.item:hover{
  transform:translateY(-3px);
  border-color:#91caff70;
}

.item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.item.locked{
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:default;
}

.item.locked:hover{transform:none}

.lock{
  color:#91a8c8;
  font-size:23px;
  opacity:.7;
}

.item.locked::after{
  content:'✧';
  position:absolute;
  bottom:12px;
  color:#91a8c8;
  font-size:12px;
}

.item img[hidden]{display:none}

.empty{
  display:none;
  color:var(--muted);
  font-size:11px;
  text-align:center;
  padding:35px 0;
}

footer{
  text-align:center;
  padding:5px 20px 35px;
}

.back{
  background:transparent;
  color:#c6d9f6;
  border:1px solid var(--line);
  border-radius:30px;
  padding:11px 25px;
  font-size:11px;
  letter-spacing:1.5px;
  cursor:pointer;
}

.back:hover{
  border-color:#91caff80;
  background:#91caff0a;
}

#viewer{
  position:fixed;
  inset:0;
  z-index:10;
  background:#050912ed;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
}

#viewer.open{display:flex}

#viewer img{
  max-width:100%;
  max-height:85vh;
  object-fit:contain;
  border-radius:12px;
  box-shadow:0 0 50px #91caff18;
}

#close{
  position:absolute;
  top:20px;
  right:22px;
  background:transparent;
  border:0;
  color:#e5edff;
  font-size:28px;
  cursor:pointer;
}

@media(max-width:600px){
  header{padding-top:36px}
  h1{font-size:36px}
  section{padding:17px}
  .gallery{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .section-head{align-items:flex-start}
}
</style>
</head>

<body>
<header>
  <div class="symbol">✧ ✦ ✧</div>
  <h1>little collection</h1>
  <div class="subtitle">things collected for you</div>
</header>

<main>
  <section>
    <div class="section-head">
      <h2>letters</h2>
      <div class="status" id="letters-status">✧ locked</div>
    </div>
    <div class="progress"><div class="progress-fill" id="letters-progress"></div></div>
    <div class="gallery" id="letters-gallery"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>picrews</h2>
      <div class="status" id="picrews-status">✧ locked</div>
    </div>
    <div class="progress"><div class="progress-fill" id="picrews-progress"></div></div>
    <div class="gallery" id="picrews-gallery"></div>
  </section>
</main>

<footer>
  <button class="back" onclick="location.href='index.html'">back ♡</button>
</footer>

<div id="viewer" onclick="closeViewer()">
  <button id="close" aria-label="Close" onclick="closeViewer()">×</button>
  <img id="viewer-image" alt="" onclick="event.stopPropagation()">
</div>

<script>
const letters = [
  "IMG_20261017_012347_350.jpg",
  "IMG_20261017_012350_325.jpg",
  "IMG_20261017_012353_072.jpg",
  "IMG_20261017_012401_558.jpg",
  "IMG_20261017_012404_053.jpg",
  "IMG_20261017_012406_165.jpg",
  "IMG_20261017_012408_855.jpg"
];

const picrews = [
  "IMG_20261017_012713_131.jpg",
  "IMG_20261017_014042_074.jpg",
  "IMG_20261017_141856_078.jpg",
  "IMG_20261017_144236_029.jpg",
  "IMG_20261017_211950_511.jpg",
  "IMG_20261017_232325_275.jpg",
  "1868017_LJIyt4uN.png"
];

function getProgress(key){
  return Math.max(0, Number(localStorage.getItem(key)) || 0);
}

function rewardUnlocked(reward, progress){
  try{
    const rewards = JSON.parse(
      localStorage.getItem("birthday_unlocked_rewards") || "[]"
    );
    return progress >= 10 || rewards.includes(reward);
  }catch{
    return progress >= 10;
  }
}

function renderGallery(id, images, unlocked){
  const gallery = document.getElementById(id);
  gallery.innerHTML = "";

  images.forEach(filename => {
    const card = document.createElement("div");
    card.className = "item" + (unlocked ? "" : " locked");

    if(!unlocked){
      card.innerHTML = '<span class="lock">✧</span>';
    }else{
      const img = document.createElement("img");
      img.src = filename;
      img.alt = "";
      img.loading = "lazy";
      img.onerror = () => {
        card.innerHTML = '<span class="lock">✧</span>';
        card.classList.add("locked");
      };
      card.appendChild(img);
      card.onclick = () => openViewer(filename);
    }

    gallery.appendChild(card);
  });
}

function render(){
  const letterProgress = getProgress("watersort_completed_levels");
  const picrewProgress = getProgress("colormatch_completed_levels");

  const lettersOpen = rewardUnlocked("letters", letterProgress);
  const picrewsOpen = rewardUnlocked("picrews", picrewProgress);

  document.getElementById("letters-progress").style.width =
    Math.min(letterProgress / 10 * 100, 100) + "%";

  document.getElementById("picrews-progress").style.width =
    Math.min(picrewProgress / 10 * 100, 100) + "%";

  document.getElementById("letters-status").textContent =
    lettersOpen ? "♡ unlocked" : "✧ " + Math.min(letterProgress,10) + " / 10";

  document.getElementById("picrews-status").textContent =
    picrewsOpen ? "♡ unlocked" : "✧ " + Math.min(picrewProgress,10) + " / 10";

  renderGallery("letters-gallery", letters, lettersOpen);
  renderGallery("picrews-gallery", picrews, picrewsOpen);
}

function openViewer(filename){
  document.getElementById("viewer-image").src = filename;
  document.getElementById("viewer").classList.add("open");
}

function closeViewer(){
  document.getElementById("viewer").classList.remove("open");
}

document.addEventListener("keydown", event => {
  if(event.key === "Escape") closeViewer();
});

window.addEventListener("storage", render);
window.addEventListener("focus", render);
document.addEventListener("visibilitychange", () => {
  if(!document.hidden) render();
});

render();
</script>
</body>
</html>
