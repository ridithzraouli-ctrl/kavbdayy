
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #080d18;
}

html {
  overflow-x: hidden;
  overscroll-behavior: none;
}

body {
  min-height: 100dvh;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: max(70px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
  color: #dce8fa;
  font-family: 'Quicksand', sans-serif;
  background: radial-gradient(ellipse at 50% 45%, #142642 0%, #0d192d 45%, #080d18 100%);
}

.star-background {
  position: fixed;
  inset: -12%;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 25%, rgba(64,104,165,.13), transparent 35%),
    radial-gradient(circle at 80% 75%, rgba(60,100,165,.12), transparent 38%);
}

.star {
  position: absolute;
  display: block;
  color: #a9caff;
  user-select: none;
  pointer-events: none;
  will-change: transform, opacity;
  animation: drift var(--duration) ease-in-out infinite alternate,
             twinkle var(--twinkle) ease-in-out infinite alternate;
  animation-delay: var(--delay), var(--delay);
}

.star.small, .star.large {
  font-family: 'Cormorant Garamond', serif;
}

.star.small {
  font-size: var(--size);
  opacity: .45;
}

.star.large {
  font-size: var(--size);
  color: rgba(137,178,239,.28);
}

.star.dot {
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: #b9d5ff;
  box-shadow: 0 0 8px rgba(135,180,255,.5);
}

@keyframes drift {
  from { transform: translate3d(-12px, 8px, 0) rotate(-12deg); }
  to { transform: translate3d(18px, -22px, 0) rotate(18deg); }
}

@keyframes twinkle {
  from { opacity: .2; }
  to { opacity: .85; }
}

.floating-star {
  position: fixed;
  z-index: 0;
  pointer-events: none;
  color: rgba(150,190,255,.28);
  font-family: 'Cormorant Garamond', serif;
  line-height: 1;
  animation: float 7s ease-in-out infinite alternate;
}

.floating-star.one {
  top: 12%;
  left: 8%;
  font-size: 58px;
  animation-delay: -2s;
}

.floating-star.two {
  top: 23%;
  right: 9%;
  font-size: 36px;
  animation-delay: -4s;
}

.floating-star.three {
  bottom: 12%;
  left: 13%;
  font-size: 42px;
  animation-delay: -1s;
}

.floating-star.four {
  bottom: 16%;
  right: 11%;
  font-size: 65px;
  animation-delay: -3s;
}

@keyframes float {
  from { transform: translate3d(-8px, 10px, 0) rotate(-10deg); }
  to { transform: translate3d(12px, -18px, 0) rotate(15deg); }
}

#returnButton,
#restartButton {
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  padding: 11px 20px;
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 50px;
  background: rgba(15,28,50,.78);
  color: #dce8fa;
  font-family: 'Quicksand', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  z-index: 5;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: background .25s ease, transform .25s ease;
}

#returnButton { left: max(16px, env(safe-area-inset-left)); }
#restartButton { right: max(16px, env(safe-area-inset-right)); }

#returnButton:hover,
#restartButton:hover {
  background: rgba(65,105,165,.4);
  transform: translateY(-2px);
}

.game {
  position: relative;
  z-index: 1;
  width: min(100%, 440px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.top-ornament {
  color: #799acb;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  letter-spacing: 10px;
  margin-bottom: -8px;
  animation: softGlow 4s ease-in-out infinite alternate;
}

@keyframes softGlow {
  from { opacity: .55; }
  to { opacity: 1; }
}

.message {
  min-height: 29px;
  width: 100%;
  text-align: center;
  color: #b9d3ff;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(17px, 4.5vw, 22px);
  letter-spacing: .7px;
  opacity: 0;
  transition: opacity .45s ease, text-shadow .45s ease;
  text-shadow: 0 0 5px rgba(143,193,255,.1);
}

.message.visible {
  opacity: .92;
  animation: gentleGlow 3.2s ease-in-out infinite;
}

#unlockMessage {
  color: #c6deff;
  display: none;
}

#unlockMessage.visible {
  display: block;
  opacity: .96;
  animation: gentleGlow 3.2s ease-in-out infinite;
}

@keyframes gentleGlow {
  0%, 100% {
    text-shadow: 0 0 5px rgba(143,193,255,.13);
    opacity: .78;
  }
  50% {
    text-shadow: 0 0 12px rgba(143,193,255,.34);
    opacity: 1;
  }
}

.progress-track {
  width: 100%;
  height: 4px;
  overflow: hidden;
  border-radius: 20px;
  background: rgba(137,178,239,.16);
  box-shadow: 0 0 12px rgba(82,139,220,.08);
  margin-top: -10px;
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #527dbd, #8fc1ff);
  box-shadow: 0 0 12px rgba(119,174,255,.55);
  transition: width .8s cubic-bezier(.22,.8,.25,1);
}

.board-shell {
  position: relative;
  width: min(88vw, 390px);
  aspect-ratio: 1;
  padding: 9px;
}

.board-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 10px;
  border: 1px solid rgba(180,210,255,.18);
  border-radius: 24px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(90,132,192,.09), transparent 70%),
    rgba(14,25,44,.76);
  box-shadow:
    0 20px 60px rgba(0,0,0,.25),
    inset 0 0 30px rgba(130,175,255,.04);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.board-wrap::before,
.board-wrap::after {
  content: "";
  position: absolute;
  width: 21px;
  height: 21px;
  pointer-events: none;
  border-color: rgba(158,195,250,.38);
  border-style: solid;
  z-index: 3;
}

.board-wrap::before {
  top: 5px;
  left: 5px;
  border-width: 1px 0 0 1px;
  border-top-left-radius: 8px;
}

.board-wrap::after {
  right: 5px;
  bottom: 5px;
  border-width: 0 1px 1px 0;
  border-bottom-right-radius: 8px;
}

#board {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  gap: 0;
  touch-action: none;
}

.cell {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell::after {
  content: "";
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(153,190,243,.17);
  transition: background .15s;
}

.cell.path-filled::after {
  background: rgba(220,236,255,.22);
}

.endpoint {
  position: relative;
  z-index: 2;
  width: 42%;
  height: 42%;
  min-width: 11px;
  min-height: 11px;
  max-width: 24px;
  max-height: 24px;
  border-radius: 50%;
  border: 2px solid var(--color);
  background: var(--color);
  box-shadow: 0 0 8px color-mix(in srgb, var(--color) 35%, transparent),
              0 0 18px color-mix(in srgb, var(--color) 15%, transparent);
}

.endpoint::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: rgba(8,13,24,.24);
}

.endpoint.connected {
  box-shadow: 0 0 9px color-mix(in srgb, var(--color) 48%, transparent),
              0 0 20px color-mix(in srgb, var(--color) 22%, transparent);
}

#lines {
  position: absolute;
  inset: 10px;
  width: calc(100% - 20px);
  height: calc(100% - 20px);
  overflow: visible;
  pointer-events: none;
  z-index: 1;
}

.path-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: .68;
  opacity: .91;
  filter: drop-shadow(0 0 1.7px currentColor);
}

.path-line.preview {
  opacity: .78;
  stroke-dasharray: .12 .1;
}

.board-shell .ornament {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #a9ceff;
  opacity: .35;
  box-shadow: 0 0 8px rgba(143,193,255,.6);
}

.ornament.a { top: 0; left: 50%; }
.ornament.b { bottom: 0; right: 50%; }
.ornament.c { top: 50%; left: 0; }
.ornament.d { top: 50%; right: 0; }

#spaceMessage {
  min-height: 22px;
  width: 100%;
  text-align: center;
  color: #b9d3ff;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(15px, 4vw, 19px);
  letter-spacing: .5px;
  opacity: 0;
  transition: opacity .4s ease;
  pointer-events: none;
}

#spaceMessage.visible {
  opacity: .92;
  animation: gentleGlow 3.2s ease-in-out infinite;
}

.bottom-ornament {
  margin-top: -5px;
  color: #799acb;
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  letter-spacing: 12px;
  animation: softGlow 4s ease-in-out infinite alternate;
}

#win {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(3,7,17,.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

#win.show {
  display: flex;
}

.win-inner {
  width: min(100%, 330px);
  padding: 30px 24px;
  text-align: center;
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 24px;
  background: rgba(14,25,44,.96);
  box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 0 30px rgba(130,175,255,.04);
  animation: modalIn .35s ease both;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

#winTitle {
  margin-bottom: 24px;
  color: #e1ecff;
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px;
  font-weight: 500;
  letter-spacing: 3px;
}

#winSubtitle {
  display: none;
}

#nextButton {
  min-width: 120px;
  padding: 11px 20px;
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 50px;
  background: rgba(45,76,122,.65);
  color: #e0eaff;
  font-family: 'Quicksand', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: background .25s ease, transform .25s ease;
}

#nextButton:hover {
  background: rgba(65,105,165,.55);
  transform: translateY(-2px);
}

@media (max-width: 420px) {
  .floating-star.one { left: 3%; font-size: 42px; }
  .floating-star.two { right: 4%; font-size: 28px; }
  .floating-star.three { left: 5%; font-size: 32px; }
  .floating-star.four { right: 4%; font-size: 45px; }
  .game { gap: 15px; }
  .board-shell { width: min(88vw, 360px); padding: 7px; }
  .board-wrap { padding: 8px; }
  #lines {
    inset: 8px;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
  }
  .bottom-ornament { margin-top: -3px; }
}

@media (max-height: 650px) {
  body { padding-top: 60px; padding-bottom: 12px; }
  .game { gap: 10px; }
  .top-ornament { margin-bottom: -7px; font-size: 16px; }
  .board-shell { width: min(78vw, 330px); }
  .bottom-ornament { font-size: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .star, .floating-star, .top-ornament, .bottom-ornament,
  .message.visible, #unlockMessage.visible, #spaceMessage.visible {
    animation: none;
  }
  #returnButton, #restartButton, #nextButton, .progress-fill {
    transition: none;
  }
}
</style>
</head>
<body>
  
<div class="star-background" id="starBackground" aria-hidden="true"></div>

<div class="floating-star one" aria-hidden="true">✦</div>
<div class="floating-star two" aria-hidden="true">✧</div>
<div class="floating-star three" aria-hidden="true">✧</div>
<div class="floating-star four" aria-hidden="true">✦</div>

<button id="returnButton" type="button">return</button>
<button id="restartButton" type="button">restart</button>

<main class="game">
  <div class="top-ornament">✦　⋆　✦</div>

  <div class="message" id="message">almosttt, you need to occupy the entire space</div>
  <div class="message" id="unlockMessage">yayyy you unlocked the picrews</div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="board-shell">
    <span class="ornament a"></span>
    <span class="ornament b"></span>
    <span class="ornament c"></span>
    <span class="ornament d"></span>

    <div class="board-wrap" id="boardWrap">
      <div id="board"></div>
      <svg id="lines" viewBox="0 0 5 5" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div id="spaceMessage">almosttt, you need to occupy the entire space</div>

  <div class="bottom-ornament">✧　·　✦　·　✧</div>
</main>

<div id="win">
  <div class="win-inner">
    <h2 id="winTitle">YAY</h2>
    <div id="winSubtitle"></div>
    <button id="nextButton" type="button">next</button>
  </div>
</div>

<script>
(() => {
  const TOTAL_LEVELS = 10;
  const REWARD_KEY = "birthday_unlocked_rewards";
  const PROGRESS_KEY = "colormatch_completed_levels";
  const RETURN_PAGE = "index.html";

  const palette = [
    "#ff668a",
    "#69c8ff",
    "#b18aff",
    "#ffd166",
    "#62dfbd",
    "#ff9c66"
  ];

  const levelDesigns = [
    { size: 5, colors: 3, route: "rows",        cuts: [1, 3, 2] },
    { size: 5, colors: 3, route: "columns",     cuts: [3, 1, 2] },
    { size: 5, colors: 4, route: "spiral",      cuts: [2, 4, 1, 3] },
    { size: 5, colors: 4, route: "rowsFlip",    cuts: [4, 1, 3, 2] },
    { size: 6, colors: 4, route: "columns",     cuts: [1, 4, 2, 3] },
    { size: 6, colors: 4, route: "spiral",      cuts: [3, 1, 4, 2] },
    { size: 6, colors: 5, route: "rowsFlip",    cuts: [2, 4, 1, 3, 2] },
    { size: 6, colors: 5, route: "columnsFlip", cuts: [4, 1, 3, 2, 5] },
    { size: 6, colors: 6, route: "spiralFlip",  cuts: [1, 4, 2, 5, 3, 2] },
    { size: 6, colors: 6, route: "rows",        cuts: [4, 2, 5, 1, 3, 2] }
  ];

  const board = document.getElementById("board");
  const boardWrap = document.getElementById("boardWrap");
  const svg = document.getElementById("lines");
  const message = document.getElementById("message");
  const unlockMessage = document.getElementById("unlockMessage");
  const spaceMessage = document.getElementById("spaceMessage");
  const progressFill = document.getElementById("progressFill");
  const win = document.getElementById("win");
  const winTitle = document.getElementById("winTitle");
  const winSubtitle = document.getElementById("winSubtitle");
  const nextButton = document.getElementById("nextButton");

  let completed = Math.max(
    0,
    Math.min(TOTAL_LEVELS, Number(localStorage.getItem(PROGRESS_KEY)) || 0)
  );

  let level = completed >= TOTAL_LEVELS ? TOTAL_LEVELS + 1 : completed + 1;
  let size = 5;
  let paths = [];
  let endpoints = new Map();
  let drawing = null;
  let occupied = new Map();
  let locked = false;
  let messageTimer = null;

  function makeStars() {
    const background = document.getElementById("starBackground");
    background.innerHTML = "";

    const symbols = ["✦", "✧", "⋆", "·"];

    for (let i = 0; i < 42; i++) {
      const star = document.createElement("span");
      const type = Math.random();

      star.className = "star";

      if (type < 0.25) {
        star.classList.add("large");
        star.textContent = symbols[Math.floor(Math.random() * 3)];
      } else if (type < 0.55) {
        star.classList.add("small");
        star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      } else {
        star.classList.add("dot");
      }

      const starSize = type > 0.55
        ? (Math.random() * 2 + 1) + "px"
        : (Math.random() * 18 + 8) + "px";

      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.setProperty("--size", starSize);
      star.style.setProperty("--duration", (5 + Math.random() * 9) + "s");
      star.style.setProperty("--twinkle", (2 + Math.random() * 4) + "s");
      star.style.setProperty("--delay", (-Math.random() * 10) + "s");

      background.appendChild(star);
    }
  }

  function isUnlocked() {
    return completed >= TOTAL_LEVELS;
  }

  function saveReward() {
    try {
      const rewards = JSON.parse(
        localStorage.getItem(REWARD_KEY) || "[]"
      );

      if (Array.isArray(rewards)) {
        if (!rewards.includes("picrews")) rewards.push("picrews");
        localStorage.setItem(REWARD_KEY, JSON.stringify(rewards));
      } else {
        localStorage.setItem(REWARD_KEY, JSON.stringify(["picrews"]));
      }
    } catch {
      localStorage.setItem(REWARD_KEY, JSON.stringify(["picrews"]));
    }
  }

  function updateProgress() {
    const progress = Math.min(completed, TOTAL_LEVELS);
    progressFill.style.width = `${progress * 10}%`;

    if (progress >= TOTAL_LEVELS) {
      unlockMessage.textContent = "yayyy you unlocked the picrews";
      unlockMessage.classList.add("visible");
      saveReward();
    } else {
      unlockMessage.classList.remove("visible");
    }
  }

  function showSpaceMessage() {
    const target = isUnlocked() ? spaceMessage : message;

    message.classList.remove("visible");
    spaceMessage.classList.remove("visible");

    target.classList.add("visible");

    clearTimeout(messageTimer);
    messageTimer = setTimeout(() => {
      target.classList.remove("visible");
    }, 3200);
  }

  function rowSnake() {
    const result = [];

    for (let row = 0; row < size; row++) {
      if (row % 2 === 0) {
        for (let col = 0; col < size; col++) {
          result.push(row * size + col);
        }
      } else {
        for (let col = size - 1; col >= 0; col--) {
          result.push(row * size + col);
        }
      }
    }

    return result;
  }

  function columnSnake() {
    const result = [];

    for (let col = 0; col < size; col++) {
      if (col % 2 === 0) {
        for (let row = 0; row < size; row++) {
          result.push(row * size + col);
        }
      } else {
        for (let row = size - 1; row >= 0; row--) {
          result.push(row * size + col);
        }
      }
    }

    return result;
  }

  function spiralRoute() {
    const result = [];
    let top = 0;
    let bottom = size - 1;
    let left = 0;
    let right = size - 1;

    while (top <= bottom && left <= right) {
      for (let col = left; col <= right; col++) {
        result.push(top * size + col);
      }
      top++;

      for (let row = top; row <= bottom; row++) {
        result.push(row * size + right);
      }
      right--;

      if (top <= bottom) {
        for (let col = right; col >= left; col--) {
          result.push(bottom * size + col);
        }
        bottom--;
      }

      if (left <= right) {
        for (let row = bottom; row >= top; row--) {
          result.push(row * size + left);
        }
        left++;
      }
    }

    return result;
  }

  function makeRoute(type) {
    let route;

    if (type === "columns" || type === "columnsFlip") {
      route = columnSnake();
    } else if (type === "spiral" || type === "spiralFlip") {
      route = spiralRoute();
    } else {
      route = rowSnake();
    }

    if (type.endsWith("Flip")) route.reverse();
    return route;
  }

  function splitRoute(route, count, weights) {
    const lengths = Array(count).fill(2);
    const remaining = route.length - count * 2;
    const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);

    const shares = weights.map(weight => {
      const exact = remaining * weight / totalWeight;
      return {
        whole: Math.floor(exact),
        fraction: exact - Math.floor(exact)
      };
    });

    shares.forEach((share, index) => {
      lengths[index] += share.whole;
    });

    const leftover = route.length -
      lengths.reduce((sum, length) => sum + length, 0);

    const order = shares
      .map((share, index) => ({ index, fraction: share.fraction }))
      .sort((a, b) => b.fraction - a.fraction);

    for (let i = 0; i < leftover; i++) {
      lengths[order[i % order.length].index]++;
    }

    const chunks = [];
    let cursor = 0;

    lengths.forEach(length => {
      chunks.push(route.slice(cursor, cursor + length));
      cursor += length;
    });

    return chunks;
  }

  function makeSolution() {
    const designIndex = (level - 1) % TOTAL_LEVELS;
    const design = levelDesigns[designIndex];
    size = design.size;

    const route = makeRoute(design.route);
    const chunks = splitRoute(route, design.colors, design.cuts);

    paths = chunks.map((cells, index) => ({
      index,
      color: palette[index],
      start: cells[0],
      end: cells[cells.length - 1],
      cells: [],
      complete: false
    }));

    endpoints = new Map();

    paths.forEach(path => {
      endpoints.set(path.start, {
        pathIndex: path.index,
        color: path.color
      });

      endpoints.set(path.end, {
        pathIndex: path.index,
        color: path.color
      });
    });
  }
  
  function renderBoard() {
    board.innerHTML = "";
    board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    board.style.gridTemplateRows = `repeat(${size}, 1fr)`;
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);

    for (let index = 0; index < size * size; index++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.index = index;

      if (endpoints.has(index)) {
        const info = endpoints.get(index);
        const dot = document.createElement("div");
        dot.className = "endpoint";
        dot.style.setProperty("--color", info.color);
        cell.appendChild(dot);
      }

      board.appendChild(cell);
    }

    renderLines();
  }

  function renderLines() {
    svg.innerHTML = "";

    paths.forEach(path => {
      if (path.cells.length < 2) return;

      const points = path.cells.map(index => {
        const row = Math.floor(index / size);
        const col = index % size;
        return `${col + .5},${row + .5}`;
      });

      const line = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "polyline"
      );

      line.setAttribute("points", points.join(" "));
      line.setAttribute("stroke", path.color);
      line.setAttribute("class", "path-line");
      line.style.color = path.color;
      svg.appendChild(line);
    });

    if (drawing && drawing.cells.length > 1) {
      const points = drawing.cells.map(index => {
        const row = Math.floor(index / size);
        const col = index % size;
        return `${col + .5},${row + .5}`;
      });

      const line = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "polyline"
      );

      line.setAttribute("points", points.join(" "));
      line.setAttribute("stroke", drawing.color);
      line.setAttribute("class", "path-line preview");
      line.style.color = drawing.color;
      svg.appendChild(line);
    }

    board.querySelectorAll(".endpoint").forEach(dot => {
      dot.classList.remove("connected");
    });

    paths.forEach(path => {
      if (!path.complete) return;

      [path.start, path.end].forEach(index => {
        const cell = board.querySelector(`[data-index="${index}"]`);
        const dot = cell && cell.querySelector(".endpoint");
        if (dot) dot.classList.add("connected");
      });
    });

    board.querySelectorAll(".cell").forEach(cell => {
      cell.classList.remove("path-filled");
    });

    const filled = new Set();

    paths.forEach(path => {
      if (path.complete) {
        path.cells.forEach(index => filled.add(index));
      }
    });

    if (drawing) {
      drawing.cells.forEach(index => filled.add(index));
    }

    filled.forEach(index => {
      const cell = board.querySelector(`[data-index="${index}"]`);
      if (cell) cell.classList.add("path-filled");
    });
  }

  function rebuildOccupied() {
    occupied = new Map();

    paths.forEach(path => {
      if (!path.complete) return;
      path.cells.forEach(cell => occupied.set(cell, path.index));
    });
  }

  function cellFromPointer(event) {
    const rect = board.getBoundingClientRect();
    const col = Math.floor(
      (event.clientX - rect.left) / rect.width * size
    );
    const row = Math.floor(
      (event.clientY - rect.top) / rect.height * size
    );

    if (row < 0 || col < 0 || row >= size || col >= size) {
      return null;
    }

    return row * size + col;
  }

  function adjacent(a, b) {
    const rowA = Math.floor(a / size);
    const colA = a % size;
    const rowB = Math.floor(b / size);
    const colB = b % size;

    return Math.abs(rowA - rowB) + Math.abs(colA - colB) === 1;
  }

  function beginDrawing(cell) {
    const endpoint = endpoints.get(cell);
    if (!endpoint) return false;

    const path = paths[endpoint.pathIndex];

    if (path.complete) {
      path.complete = false;
      path.cells = [];
      rebuildOccupied();
    }

    drawing = {
      pathIndex: path.index,
      color: path.color,
      start: cell,
      cells: [cell]
    };

    renderLines();
    return true;
  }

  function extendDrawing(target) {
    if (!drawing || target === null) return;

    const current = drawing.cells[drawing.cells.length - 1];
    if (target === current) return;

    const previousPosition = drawing.cells.indexOf(target);

    if (previousPosition !== -1) {
      drawing.cells = drawing.cells.slice(0, previousPosition + 1);
      renderLines();
      return;
    }

    if (!adjacent(current, target)) return;

    const endpoint = endpoints.get(target);

    if (endpoint && endpoint.pathIndex !== drawing.pathIndex) {
      return;
    }

    const owner = occupied.get(target);

    if (owner !== undefined && owner !== drawing.pathIndex) {
      return;
    }

    drawing.cells.push(target);

    if (endpoint && endpoint.pathIndex === drawing.pathIndex) {
      const path = paths[drawing.pathIndex];

      if (
        (target === path.start || target === path.end) &&
        target !== drawing.start
      ) {
        path.cells = [...drawing.cells];
        path.complete = true;
        drawing = null;
        rebuildOccupied();
        renderLines();
        checkComplete();
        return;
      }
    }

    renderLines();
  }

  function finishDrawing() {
    if (!drawing) return;

    const path = paths[drawing.pathIndex];
    const last = drawing.cells[drawing.cells.length - 1];

    if (
      (last === path.start || last === path.end) &&
      last !== drawing.start
    ) {
      path.cells = [...drawing.cells];
      path.complete = true;
      rebuildOccupied();
    }

    drawing = null;
    renderLines();
    checkComplete();
  }

  function allCellsCovered() {
    const filled = new Set();

    paths.forEach(path => {
      if (path.complete) {
        path.cells.forEach(cell => filled.add(cell));
      }
    });

    return filled.size === size * size;
  }

  function checkComplete() {
    const allConnected = paths.every(path => path.complete);
    const covered = allCellsCovered();

    if (allConnected && covered) {
      message.classList.remove("visible");
      spaceMessage.classList.remove("visible");
      message.dataset.show = "false";
      winLevel();
    } else if (allConnected && !covered) {
      showSpaceMessage();
    }
  }

  function winLevel() {
    locked = true;

    completed = Math.max(
      completed,
      Math.min(level, TOTAL_LEVELS)
    );

    localStorage.setItem(PROGRESS_KEY, String(completed));

    if (completed >= TOTAL_LEVELS) {
      saveReward();
    }

    updateProgress();

    // Keep the completion popup the same on every level.
    winTitle.textContent = "YAY";
    winSubtitle.textContent = "";
    nextButton.textContent = "next";

    win.classList.add("show");
  }

  function startLevel() {
    locked = false;
    drawing = null;
    win.classList.remove("show");
    message.classList.remove("visible");
    spaceMessage.classList.remove("visible");
    message.dataset.show = "false";
    clearTimeout(messageTimer);

    makeSolution();
    rebuildOccupied();
    renderBoard();
    updateProgress();
  }

  boardWrap.addEventListener("pointerdown", event => {
    if (locked) return;

    const cell = cellFromPointer(event);
    if (cell === null || !endpoints.has(cell)) return;

    event.preventDefault();

    try {
      boardWrap.setPointerCapture(event.pointerId);
    } catch {}

    beginDrawing(cell);
  });

  boardWrap.addEventListener("pointermove", event => {
    if (locked || !drawing) return;

    const target = cellFromPointer(event);
    if (target === null) return;

    let current = drawing.cells[drawing.cells.length - 1];

    while (current !== target) {
      const row = Math.floor(current / size);
      const col = current % size;
      const targetRow = Math.floor(target / size);
      const targetCol = target % size;

      let next;
      const dx = Math.abs(targetCol - col);
      const dy = Math.abs(targetRow - row);

      if (dx >= dy && col !== targetCol) {
        next = current + (targetCol > col ? 1 : -1);
      } else if (row !== targetRow) {
        next = current + (targetRow > row ? size : -size);
      } else if (col !== targetCol) {
        next = current + (targetCol > col ? 1 : -1);
      } else {
        break;
      }

      if (!adjacent(current, next)) break;

      const oldLength = drawing.cells.length;
      extendDrawing(next);

      if (!drawing) return;

      const newCurrent = drawing.cells[drawing.cells.length - 1];

      if (
        drawing.cells.length === oldLength &&
        newCurrent === current
      ) {
        break;
      }

      current = newCurrent;
    }
  });

  boardWrap.addEventListener("pointerup", finishDrawing);
  boardWrap.addEventListener("pointercancel", finishDrawing);

  document.getElementById("restartButton").addEventListener("click", startLevel);

  document.getElementById("returnButton").addEventListener("click", () => {
    window.location.href = RETURN_PAGE;
  });

  nextButton.addEventListener("click", () => {
    win.classList.remove("show");
    level++;
    startLevel();
  });

  if (completed >= TOTAL_LEVELS) {
    saveReward();
  }

  makeStars();
  startLevel();
})();
</script>
</body>
</html>
