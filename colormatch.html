<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect the Colors ♡</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #080d18;
  --panel: rgba(19, 33, 55, .78);
  --line: rgba(183, 211, 255, .13);
  --text: #edf2ff;
  --muted: #98a9c5;
  --blue: #82c9ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px 14px 35px;
  color: var(--text);
  font-family: 'Quicksand', sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #1a3150 0%, transparent 55%),
    radial-gradient(ellipse at 0% 75%, #111c32 0%, transparent 50%),
    var(--bg);
  display: flex;
  justify-content: center;
  overflow-x: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.page {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 24px;
}

.small-btn {
  border: 1px solid var(--line);
  color: var(--muted);
  background: rgba(255,255,255,.035);
  padding: 9px 13px;
  border-radius: 30px;
  font-size: 11px;
  letter-spacing: .5px;
  transition: .18s ease;
}

.small-btn:active {
  transform: scale(.96);
}

.heading {
  text-align: center;
  margin-bottom: 20px;
}

.eyebrow {
  color: #9bb8dc;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 7px;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  font-size: clamp(32px, 8vw, 43px);
  line-height: 1;
  margin: 0;
  letter-spacing: .5px;
}

h1 span {
  color: #a6d7ff;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 10px;
}

.progress-wrap {
  margin: 0 auto 17px;
  max-width: 390px;
}

.progress-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
  margin-bottom: 7px;
}

.progress-track {
  height: 3px;
  background: rgba(255,255,255,.09);
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #80caff, #d6c8ff);
  transition: width .25s ease;
}

.game-panel {
  border: 1px solid var(--line);
  background: linear-gradient(145deg, rgba(22,38,62,.88), rgba(11,20,36,.94));
  border-radius: 23px;
  padding: 17px 13px 15px;
  box-shadow: 0 15px 45px rgba(0,0,0,.18);
}

.level-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 5px;
  margin-bottom: 13px;
}

.level-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 23px;
}

.level-count {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
}

.board-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
}

.board {
  position: relative;
  width: min(100%, 390px);
  aspect-ratio: 1;
  display: grid;
  gap: 4px;
  padding: 5px;
  border-radius: 15px;
  background: rgba(4,10,20,.52);
  border: 1px solid rgba(255,255,255,.055);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.cell {
  min-width: 0;
  min-height: 0;
  position: relative;
  border-radius: 6px;
  background: rgba(139,168,208,.075);
  border: 1px solid rgba(169,198,235,.045);
  transition: background .08s linear;
}

.cell.endpoint {
  background: color-mix(in srgb, var(--endpoint-color) 19%, rgba(139,168,208,.08));
  border: 1px solid color-mix(in srgb, var(--endpoint-color) 45%, transparent);
}

.cell.endpoint::after {
  content: "";
  position: absolute;
  width: 37%;
  height: 37%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: var(--endpoint-color);
  box-shadow: 0 0 10px color-mix(in srgb, var(--endpoint-color) 50%, transparent);
}

.cell.filled {
  background: color-mix(in srgb, var(--path-color) 13%, rgba(139,168,208,.07));
}

.line-layer {
  position: absolute;
  inset: 5px;
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  pointer-events: none;
  overflow: visible;
  z-index: 3;
}

.path-line {
  fill: none;
  stroke: var(--path-color);
  stroke-width: .66;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .92;
  vector-effect: non-scaling-stroke;
}

.path-glow {
  fill: none;
  stroke: var(--path-color);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .12;
  filter: blur(2px);
  vector-effect: non-scaling-stroke;
}

.status {
  min-height: 20px;
  text-align: center;
  margin: 13px 0 4px;
  color: #b9cce6;
  font-size: 11px;
  letter-spacing: .2px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  margin-top: 13px;
}

.action-btn {
  border: 1px solid rgba(164,203,255,.2);
  border-radius: 30px;
  background: rgba(137,190,255,.08);
  color: #dceaff;
  padding: 11px 19px;
  font-size: 11px;
  transition: transform .15s, background .15s;
}

.action-btn:active {
  transform: scale(.96);
  background: rgba(137,190,255,.16);
}

.hint {
  text-align: center;
  color: #7186a5;
  font-size: 10px;
  line-height: 1.7;
  margin: 14px auto 0;
  max-width: 300px;
}

.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  padding: 20px;
  align-items: center;
  justify-content: center;
  background: rgba(3,7,15,.8);
  backdrop-filter: blur(8px);
}

.modal-backdrop.show {
  display: flex;
}

.modal {
  width: min(100%, 350px);
  text-align: center;
  border: 1px solid rgba(171,206,255,.2);
  border-radius: 23px;
  padding: 29px 22px 23px;
  background: linear-gradient(145deg, #172942, #0c1526);
  animation: appear .2s ease-out;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(7px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-mark {
  font-family: 'Cormorant Garamond', serif;
  font-size: 35px;
  color: #a8d8ff;
  margin-bottom: 5px;
}

.modal h2 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 500;
  font-size: 30px;
  margin: 0 0 9px;
}

.modal p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
  margin: 0 0 19px;
}

@media (max-width: 420px) {
  body { padding: 17px 11px 25px; }
  .game-panel { padding: 13px 9px 13px; border-radius: 19px; }
  .board { gap: 3px; padding: 4px; }
  .line-layer { inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); }
  .topbar { margin-bottom: 21px; }
}
</style>
</head>

<body>
<main class="page">

  <div class="topbar">
    <button class="small-btn" id="backBtn">← back</button>
    <button class="small-btn" id="resetBtn">restart level</button>
  </div>

  <header class="heading">
    <div class="eyebrow">a little birthday game</div>
    <h1>Connect the <span>Colors ♡</span></h1>
    <div class="subtitle">connect every pair and fill the whole board</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-top">
      <span>YOUR PROGRESS</span>
      <span id="progressText">0 / 10</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <section class="game-panel">
    <div class="level-row">
      <div class="level-name" id="levelName">Level 01</div>
      <div class="level-count" id="levelCount">LEVEL 1 OF 10</div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board">
        <svg class="line-layer" id="lineLayer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div class="status" id="status"></div>

    <div class="controls">
      <button class="action-btn" id="clearBtn">clear lines</button>
      <button class="action-btn" id="nextBtn" style="display:none">next level ↗</button>
    </div>
  </section>

  <div class="hint">drag from one dot to its matching dot ✦<br>no diagonals · fill every little square</div>

</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-mark">✦ ♡ ✦</div>
    <h2 id="modalTitle">level complete</h2>
    <p id="modalText"></p>
    <button class="action-btn" id="modalBtn">continue ↗</button>
  </div>
</div>

<script>const board = document.getElementById('board');
const lineLayer = document.getElementById('lineLayer');
const statusText = document.getElementById('status');
const nextBtn = document.getElementById('nextBtn');
const modalBackdrop = document.getElementById('modalBackdrop');

const COLORS = [
  '#ff8db5',
  '#80caff',
  '#bba0ff',
  '#8ce3bd',
  '#ffd27f',
  '#ff9c83',
  '#8de1e8',
  '#d9a8ff'
];

const LEVELS = [
  { size: 5, colors: 3 },
  { size: 5, colors: 4 },
  { size: 6, colors: 3 },
  { size: 6, colors: 4 },
  { size: 7, colors: 4 },
  { size: 7, colors: 5 },
  { size: 8, colors: 4 },
  { size: 8, colors: 5 },
  { size: 8, colors: 5 },
  { size: 8, colors: 6 }
];

let level = 1;
let size = 5;
let paths = [];
let endpointMap = new Map();
let activePath = null;
let activeSide = null;
let drawing = false;
let completedLevels = Math.min(
  10,
  Math.max(0, Number(localStorage.getItem('connectcolors_completed_levels')) || 0)
);
let levelWon = false;
let frameRequested = false;

const indexOf = (r, c) => r * size + c;
const rowOf = i => Math.floor(i / size);
const colOf = i => i % size;

function snakeRoute(n) {
  const route = [];

  for (let r = 0; r < n; r++) {
    if (r % 2 === 0) {
      for (let c = 0; c < n; c++) route.push(r * n + c);
    } else {
      for (let c = n - 1; c >= 0; c--) route.push(r * n + c);
    }
  }

  return route;
}

function generatePuzzle() {
  size = LEVELS[level - 1].size;
  const colorCount = LEVELS[level - 1].colors;
  const route = snakeRoute(size);
  const total = route.length;
  const base = Math.floor(total / colorCount);
  let extra = total % colorCount;
  let offset = 0;

  paths = [];

  for (let i = 0; i < colorCount; i++) {
    const length = base + (extra-- > 0 ? 1 : 0);
    const solution = route.slice(offset, offset + length);
    offset += length;

    paths.push({
      id: i,
      color: COLORS[i],
      solution,
      cells: [],
      connected: false
    });
  }

  endpointMap = new Map();

  paths.forEach(path => {
    endpointMap.set(path.solution[0], { id: path.id, side: 0 });
    endpointMap.set(path.solution[path.solution.length - 1], {
      id: path.id,
      side: 1
    });
  });
}

function startLevel() {
  level = Math.min(10, Math.max(1, level));
  levelWon = false;
  drawing = false;
  activePath = null;
  activeSide = null;

  generatePuzzle();

  board.style.gridTemplateColumns = `repeat(${size}, minmax(0, 1fr))`;
  board.style.gridTemplateRows = `repeat(${size}, minmax(0, 1fr))`;
  board.style.aspectRatio = '1';

  board.querySelectorAll('.cell').forEach(cell => cell.remove());

  for (let i = 0; i < size * size; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.index = i;

    const endpoint = endpointMap.get(i);

    if (endpoint) {
      const path = paths[endpoint.id];
      cell.classList.add('endpoint');
      cell.style.setProperty('--endpoint-color', path.color);
    }

    board.insertBefore(cell, lineLayer);
  }

  lineLayer.setAttribute('viewBox', `0 0 ${size} ${size}`);
  lineLayer.innerHTML = '';

  paths.forEach(path => {
    path.cells = [];
    path.connected = false;
  });

  document.getElementById('levelName').textContent =
    `Level ${String(level).padStart(2, '0')}`;

  document.getElementById('levelCount').textContent =
    `LEVEL ${level} OF 10`;

  nextBtn.style.display = 'none';
  statusText.textContent = '';
  updateProgress();
  renderLines();
}

function updateProgress() {
  document.getElementById('progressText').textContent =
    `${completedLevels} / 10`;

  document.getElementById('progressFill').style.width =
    `${completedLevels * 10}%`;
}

function clearLines() {
  if (levelWon) return;

  paths.forEach(path => {
    path.cells = [];
    path.connected = false;
  });

  activePath = null;
  activeSide = null;
  drawing = false;
  statusText.textContent = '';
  renderLines();
}

function renderLines() {
  lineLayer.innerHTML = '';

  board.querySelectorAll('.cell').forEach(cell => {
    cell.classList.remove('filled');
    cell.style.removeProperty('--path-color');
  });

  paths.forEach(path => {
    const cells = path.cells;

    cells.forEach(index => {
      const cell = board.querySelector(`[data-index="${index}"]`);
      if (cell) {
        cell.classList.add('filled');
        cell.style.setProperty('--path-color', path.color);
      }
    });

    if (cells.length < 2) return;

    const points = cells.map(index =>
      `${colOf(index) + 0.5},${rowOf(index) + 0.5}`
    ).join(' ');

    const glow = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    glow.setAttribute('points', points);
    glow.setAttribute('class', 'path-glow');
    glow.style.setProperty('--path-color', path.color);
    lineLayer.appendChild(glow);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', points);
    line.setAttribute('class', 'path-line');
    line.style.setProperty('--path-color', path.color);
    lineLayer.appendChild(line);
  });
}

function getCellAt(x, y) {
  const rect = board.getBoundingClientRect();
  const styles = getComputedStyle(board);
  const padding = parseFloat(styles.paddingLeft) || 0;

  const left = rect.left + padding;
  const top = rect.top + padding;
  const width = rect.width - padding * 2;
  const height = rect.height - padding * 2;

  const col = Math.floor(((x - left) / width) * size);
  const row = Math.floor(((y - top) / height) * size);

  if (row < 0 || col < 0 || row >= size || col >= size) return null;

  return indexOf(row, col);
}

function adjacent(a, b) {
  return Math.abs(rowOf(a) - rowOf(b)) +
         Math.abs(colOf(a) - colOf(b)) === 1;
}

function beginPath(index) {
  if (levelWon) return;

  const endpoint = endpointMap.get(index);
  if (!endpoint) return;

  const path = paths[endpoint.id];

  if (path.connected) {
    path.cells = [];
    path.connected = false;
  }

  activePath = path;
  activeSide = endpoint.side;
  drawing = true;

  const start = activeSide === 0
    ? path.solution[0]
    : path.solution[path.solution.length - 1];

  path.cells = [start];
  statusText.textContent = '';
  renderLines();
}

function moveToCell(index) {
  if (!drawing || !activePath || levelWon) return;

  const cells = activePath.cells;
  const last = cells[cells.length - 1];

  if (index === last) return;

  // Dragging backwards removes the last segment.
  if (cells.length > 1 && index === cells[cells.length - 2]) {
    cells.pop();
    activePath.connected = false;
    renderLines();
    return;
  }

  if (!adjacent(last, index)) return;

  // Don't cross another color's line or reuse one of its cells.
  for (const path of paths) {
    if (path.id !== activePath.id && path.cells.includes(index)) return;
  }

  // Only the matching endpoint can finish this line.
  const endpoint = endpointMap.get(index);

  if (endpoint && endpoint.id !== activePath.id) return;

  if (cells.includes(index)) return;

  cells.push(index);

  if (endpoint && endpoint.id === activePath.id) {
    const correctEnd = activeSide === 0
      ? activePath.solution[activePath.solution.length - 1]
      : activePath.solution[0];

    if (index === correctEnd) {
      activePath.connected = true;
      drawing = false;
      activePath = null;
      activeSide = null;
      renderLines();
      checkCompletion();
      return;
    }
  }

  renderLines();
}

function finishDrawing() {
  if (!drawing) return;

  drawing = false;

  if (activePath && !activePath.connected) {
    // Keep the partial line so the player can continue it.
    statusText.textContent = 'keep going ✦';
  }

  activePath = null;
  activeSide = null;
}

function checkCompletion() {
  const allConnected = paths.every(path => path.connected);

  if (!allConnected) return;

  const occupied = new Set(paths.flatMap(path => path.cells));
  const total = size * size;

  if (occupied.size !== total) {
    statusText.textContent = 'almostt, you need to fill up the entire board';
    return;
  }

  winLevel();
}

function winLevel() {
  if (levelWon) return;

  levelWon = true;
  completedLevels = Math.max(completedLevels, level);
  localStorage.setItem('connectcolors_completed_levels', String(completedLevels));
  updateProgress();

  if (completedLevels >= 10) {
    unlockPicrews();
    document.getElementById('modalTitle').textContent = 'yayyy ♡';
    document.getElementById('modalText').textContent =
      'yayyy you unlocked the picrews';
    document.getElementById('modalBtn').textContent = 'done ♡';
    nextBtn.style.display = 'none';
  } else {
    statusText.textContent = 'perfect, you did it ♡';
    nextBtn.style.display = 'inline-block';
    document.getElementById('modalTitle').textContent = 'level complete';
    document.getElementById('modalText').textContent =
      'you connected everything ♡ ready for the next one?';
    document.getElementById('modalBtn').textContent = 'next level ↗';
  }

  modalBackdrop.classList.add('show');
}

function unlockPicrews() {
  localStorage.setItem('picrewsUnlocked', 'true');
  localStorage.setItem('arcade_picrews_unlocked', 'true');

  let rewards = [];

  try {
    rewards = JSON.parse(localStorage.getItem('birthday_unlocked_rewards') || '[]');
    if (!Array.isArray(rewards)) rewards = [];
  } catch {
    rewards = [];
  }

  if (!rewards.includes('picrews')) {
    rewards.push('picrews');
  }

  localStorage.setItem('birthday_unlocked_rewards', JSON.stringify(rewards));
}

function nextLevel() {
  modalBackdrop.classList.remove('show');

  if (completedLevels >= 10) return;

  level = Math.min(10, level + 1);
  startLevel();
}

board.addEventListener('pointerdown', event => {
  if (levelWon) return;

  const index = getCellAt(event.clientX, event.clientY);
  if (index === null) return;

  if (endpointMap.has(index)) {
    beginPath(index);
    board.setPointerCapture(event.pointerId);
    event.preventDefault();
  }
});

board.addEventListener('pointermove', event => {
  if (!drawing) return;

  const index = getCellAt(event.clientX, event.clientY);
  if (index !== null) moveToCell(index);

  event.preventDefault();
});

board.addEventListener('pointerup', finishDrawing);
board.addEventListener('pointercancel', finishDrawing);

document.getElementById('clearBtn').addEventListener('click', clearLines);
document.getElementById('resetBtn').addEventListener('click', startLevel);

nextBtn.addEventListener('click', nextLevel);

document.getElementById('modalBtn').addEventListener('click', () => {
  if (completedLevels >= 10) {
    modalBackdrop.classList.remove('show');
    return;
  }

  nextLevel();
});

document.getElementById('backBtn').addEventListener('click', () => {
  if (history.length > 1) {
    history.back();
  } else {
    statusText.textContent = 'you can close this page to go back ♡';
  }
});

startLevel();
</script>
</body>
  </html>
