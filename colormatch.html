<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♡ connect the colors</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080d18;
  --blue: #83baff;
  --text: #e2eaf7;
  --border: rgba(131,186,255,.2);
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}
body {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 0%, #142642 0%, transparent 54%),
    radial-gradient(ellipse at 0% 100%, #101d34 0%, transparent 45%),
    var(--bg);
  font-family: 'Quicksand', sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
#stars {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.star {
  position: absolute;
  color: #c4dcff;
  opacity: .35;
  animation: twinkle var(--duration,4s) ease-in-out infinite alternate;
  animation-delay: var(--delay,0s);
}
@keyframes twinkle {
  from { opacity: .12; transform: scale(.8); }
  to { opacity: .7; transform: scale(1.15); }
}
.page {
  width: min(100%,510px);
  max-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(8px,1.7vh,15px);
  position: relative;
  z-index: 1;
}
.topbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.small-button {
  border: 1px solid var(--border);
  background: rgba(16,30,52,.65);
  color: #b8cce8;
  border-radius: 30px;
  padding: 8px 13px;
  font: 500 11px 'Quicksand',sans-serif;
  letter-spacing: .5px;
  cursor: pointer;
  transition: background .25s,border-color .25s,transform .25s;
}
.small-button:hover {
  background: rgba(76,126,190,.18);
  border-color: rgba(131,186,255,.5);
}
.small-button:active { transform: scale(.96); }
.heading { text-align: center; flex-shrink: 0; }
.ornament {
  color: #91baff;
  font-size: 12px;
  letter-spacing: 8px;
  opacity: .7;
  margin-bottom: 1px;
}
h1 {
  font-family: 'Cormorant Garamond',serif;
  font-weight: 400;
  font-size: clamp(31px,6.5vh,43px);
  line-height: 1;
  letter-spacing: 2px;
  margin: 2px 0 5px;
  color: #e4edff;
}
.subtitle {
  font-size: 10px;
  letter-spacing: 2px;
  color: #91a8c9;
  text-transform: lowercase;
}
.progress-wrap {
  width: min(100%,340px);
  padding: 0 3px;
  flex-shrink: 0;
}
.progress-track {
  height: 3px;
  width: 100%;
  border-radius: 20px;
  overflow: hidden;
  background: rgba(131,186,255,.12);
}
.progress-line {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg,#5a8fd0,#b1d7ff);
  box-shadow: 0 0 9px rgba(131,186,255,.65);
  transition: width .65s cubic-bezier(.2,.8,.2,1);
}
.progress-line.pulse {
  animation: linePulse 3.2s ease-in-out infinite;
}
@keyframes linePulse {
  0%,100% { opacity: .28; box-shadow: 0 0 3px rgba(131,186,255,.2); }
  50% { opacity: 1; box-shadow: 0 0 13px rgba(131,186,255,.9); }
}
.game-card {
  width: min(100%,420px);
  padding: clamp(12px,2.3vh,18px);
  border: 1px solid var(--border);
  border-radius: 27px;
  background: rgba(14,25,44,.76);
  box-shadow: 0 15px 50px rgba(0,0,0,.18),inset 0 0 25px rgba(92,145,211,.025);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 1;
  min-height: 0;
}
.board {
  position: relative;
  width: min(100%,365px,48vh);
  aspect-ratio: 1;
  display: grid;
  touch-action: none;
  overflow: visible;
}
.cell {
  position: relative;
  min-width: 0;
  min-height: 0;
  border: 1px solid rgba(145,179,224,.075);
  border-radius: 8px;
  background: rgba(10,19,34,.43);
}
.cell.occupied { background: rgba(91,135,190,.08); }
.cell.endpoint { background: rgba(91,135,190,.035); }
.paths-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 2;
}
.path-line {
  fill: none;
  stroke-width: 5.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .94;
  filter: drop-shadow(0 0 2px currentColor);
  transition: opacity .35s ease;
}
.path-line.completed { animation: pathPulse 3.2s ease-in-out infinite; }
@keyframes pathPulse {
  0%,100% { opacity: .36; }
  50% { opacity: .98; }
}
.endpoint-ball {
  stroke: rgba(255,255,255,.8);
  stroke-width: .7;
  filter: drop-shadow(0 0 2px currentColor);
}
.bottom-ornament {
  color: #91baff;
  font-size: 11px;
  letter-spacing: 7px;
  opacity: .55;
  text-align: center;
  flex-shrink: 0;
}
.modal {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(3,7,15,.72);
  backdrop-filter: blur(8px);
}
.modal.show {
  display: flex;
  animation: fadeIn .3s ease both;
}
.modal-card {
  width: min(100%,330px);
  text-align: center;
  border: 1px solid rgba(131,186,255,.32);
  border-radius: 25px;
  padding: 28px 23px;
  background: radial-gradient(ellipse at top,rgba(48,80,126,.24),transparent 65%),#0c1628;
  box-shadow: 0 20px 70px rgba(0,0,0,.35);
  animation: riseIn .45s cubic-bezier(.2,.8,.2,1) both;
}
.modal-ornament {
  font-size: 14px;
  letter-spacing: 8px;
  color: var(--blue);
  margin-bottom: 9px;
}
.modal-title {
  font-family: 'Cormorant Garamond',serif;
  font-size: 34px;
  font-weight: 400;
  color: #e5eeff;
  margin-bottom: 8px;
}
.modal-text {
  color: #a5b5cf;
  font-size: 12px;
  line-height: 1.8;
  margin-bottom: 20px;
}
.modal-button {
  border: 1px solid rgba(131,186,255,.42);
  background: rgba(86,140,207,.16);
  color: #dceaff;
  border-radius: 30px;
  padding: 11px 24px;
  font: 500 11px 'Quicksand',sans-serif;
  letter-spacing: 1.2px;
  cursor: pointer;
  transition: background .2s,transform .2s;
}
.modal-button:hover { background: rgba(86,140,207,.3); }
.modal-button:active { transform: scale(.97); }
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes riseIn {
  from { opacity: 0; transform: translateY(10px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@media (max-height:650px) {
  .page { gap: 7px; }
  .game-card { padding: 9px; border-radius: 21px; }
  .board { width: min(100%,330px,44vh); }
  h1 { font-size: 30px; }
  .ornament { font-size: 10px; }
  .bottom-ornament { font-size: 9px; }
}
@media (max-width:380px) {
  .game-card { padding: 9px; }
  .board { width: min(100%,44vh); }
  .small-button { padding: 7px 10px; font-size: 10px; }
}
  </style></head>
<body>
<div id="stars"></div>

<main class="page">
  <div class="topbar">
    <button class="small-button" id="backButton">← return</button>
    <button class="small-button" id="restartButton">restart</button>
  </div>

  <header class="heading">
    <div class="ornament">✦　⋆　✦</div>
    <h1>♡</h1>
    <div class="subtitle">✧　connect the colors　✧</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-line" id="progressLine"></div>
    </div>
  </div>

  <section class="game-card">
    <div class="board" id="board">
      <svg class="paths-svg" id="pathsSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <div class="bottom-ornament">✧　·　✦　·　✧</div>
</main>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-ornament">✦　✧　✦</div>
    <div class="modal-title" id="modalTitle">♡</div>
    <div class="modal-text" id="modalText"></div>
    <button class="modal-button" id="modalButton">continue</button>
  </div>
</div>

<script>
const COLORS = [
  "#8bbdff",
  "#d3a6ff",
  "#8ee1d0",
  "#f0b5cf",
  "#f2d28e",
  "#a8b5ff"
];

const board = document.getElementById("board");
const pathsSvg = document.getElementById("pathsSvg");
const progressLine = document.getElementById("progressLine");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");
const modalButton = document.getElementById("modalButton");

let level = 1;
let size = 5;
let paths = [];
let cells = [];
let drawing = null;
let drawingFrom = null;
let puzzleFinished = false;
let finalUnlocked = false;

const NS = "http://www.w3.org/2000/svg";

function makeStars() {
  const holder = document.getElementById("stars");
  const symbols = ["✦", "✧", "⋆", "·"];

  for (let i = 0; i < 44; i++) {
    const star = document.createElement("span");
    star.className = "star";
    star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.fontSize = (5 + Math.random() * 11) + "px";
    star.style.setProperty("--duration", (2.8 + Math.random() * 4.5) + "s");
    star.style.setProperty("--delay", (-Math.random() * 5) + "s");
    holder.appendChild(star);
  }
}

function cellId(row, col) {
  return row * size + col;
}

function coordinates(id) {
  return {
    row: Math.floor(id / size),
    col: id % size
  };
}

function neighbors(id) {
  const { row, col } = coordinates(id);
  const result = [];

  if (row > 0) result.push(cellId(row - 1, col));
  if (row < size - 1) result.push(cellId(row + 1, col));
  if (col > 0) result.push(cellId(row, col - 1));
  if (col < size - 1) result.push(cellId(row, col + 1));

  return result;
}

function buildSnakeRoute() {
  const route = [];
  const columnMode = Math.random() < 0.5;

  if (!columnMode) {
    for (let r = 0; r < size; r++) {
      if (r % 2 === 0) {
        for (let c = 0; c < size; c++) route.push(cellId(r, c));
      } else {
        for (let c = size - 1; c >= 0; c--) route.push(cellId(r, c));
      }
    }
  } else {
    for (let c = 0; c < size; c++) {
      if (c % 2 === 0) {
        for (let r = 0; r < size; r++) route.push(cellId(r, c));
      } else {
        for (let r = size - 1; r >= 0; r--) route.push(cellId(r, c));
      }
    }
  }

  if (Math.random() < 0.5) route.reverse();
  return route;
}

function generatePuzzle() {
  size = level <= 3 ? 5 : level <= 6 ? 6 : 7;

  const route = buildSnakeRoute();
  const total = size * size;
  const count = Math.min(2 + Math.floor((level - 1) / 2), 6);
  const cuts = [];
  const minLength = 4;

  for (let i = 1; i < count; i++) {
    const ideal = Math.round(total * i / count);
    const low = (cuts.length ? cuts[cuts.length - 1] : 0) + minLength;
    const high = total - (count - i) * minLength;
    const jitter = Math.floor(Math.random() * 5) - 2;

    cuts.push(Math.max(low, Math.min(high, ideal + jitter)));
  }

  const bounds = [0, ...cuts, total];
  const generated = [];

  for (let i = 0; i < count; i++) {
    const solution = route.slice(bounds[i], bounds[i + 1]);

    generated.push({
      color: COLORS[i],
      start: solution[0],
      end: solution[solution.length - 1],
      solution,
      cells: [],
      connected: false
    });
  }

  return generated;
}

function createSvgElement(name, attrs = {}) {
  const element = document.createElementNS(NS, name);

  for (const [key, value] of Object.entries(attrs)) {
    element.setAttribute(key, value);
  }

  return element;
}

function pointForCell(id) {
  const { row, col } = coordinates(id);

  return {
    x: ((col + 0.5) / size) * 100,
    y: ((row + 0.5) / size) * 100
  };
}

function hexToRgba(hex, alpha) {
  const clean = hex.replace("#", "");
  const value = parseInt(clean, 16);
  const r = (value >> 16) & 255;
  const g = (value >> 8) & 255;
  const b = value & 255;

  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function renderBoard() {
  board.querySelectorAll(".cell").forEach(el => el.remove());
  pathsSvg.innerHTML = "";
  cells = [];

  board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  board.style.gridTemplateRows = `repeat(${size}, 1fr)`;

  for (let i = 0; i < size * size; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.id = i;
    cell.addEventListener("pointerdown", startDrawing);
    board.insertBefore(cell, pathsSvg);
    cells.push(cell);
  }

  updateBoard();
}

function updateBoard() {
  for (const cell of cells) {
    cell.classList.remove("occupied", "endpoint");
    cell.style.background = "";
  }

  for (const path of paths) {
    for (const id of path.cells) {
      const cell = cells[id];

      if (cell) {
        cell.classList.add("occupied");
        cell.style.background = hexToRgba(path.color, .12);
      }
    }

    for (const id of [path.start, path.end]) {
      const cell = cells[id];

      if (cell) {
        cell.classList.add("endpoint");
        cell.style.background = hexToRgba(path.color, .1);
      }
    }
  }

  drawPaths();
}

function drawPaths() {
  pathsSvg.innerHTML = "";

  for (const path of paths) {
    if (path.cells.length > 1) {
      const points = path.cells.map(pointForCell);
      const d = points.map((p, i) =>
        `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`
      ).join(" ");

      const line = createSvgElement("path", {
        d,
        class: "path-line" + (puzzleFinished ? " completed" : ""),
        stroke: path.color
      });

      pathsSvg.appendChild(line);
    }

    for (const id of [path.start, path.end]) {
      const p = pointForCell(id);

      const ball = createSvgElement("circle", {
        cx: p.x,
        cy: p.y,
        r: 3.8,
        fill: path.color,
        class: "endpoint-ball"
      });

      pathsSvg.appendChild(ball);
    }
  }
}function getPathAtEndpoint(id) {
  return paths.find(path => path.start === id || path.end === id);
}

function pathOwner(id) {
  return paths.find(path => path.cells.includes(id));
}

function startDrawing(event) {
  if (puzzleFinished) return;

  const id = Number(event.currentTarget.dataset.id);
  const path = getPathAtEndpoint(id);

  if (!path) return;

  if (path.connected) {
    path.cells = [];
    path.connected = false;
  }

  for (const other of paths) {
    if (other !== path && other.cells.includes(id)) return;
  }

  drawing = path;
  drawingFrom = id === path.start ? "start" : "end";
  drawing.cells = [id];

  event.preventDefault();
  updateBoard();
}

function getCellFromPointer(event) {
  const element = document.elementFromPoint(event.clientX, event.clientY);

  if (!element) return null;

  const cell = element.closest(".cell");

  if (!cell || !board.contains(cell)) return null;

  return Number(cell.dataset.id);
}

function pointerMove(event) {
  if (!drawing || puzzleFinished) return;

  const id = getCellFromPointer(event);
  if (id === null || id === undefined) return;

  const list = drawing.cells;
  const last = list[list.length - 1];

  if (id === last) return;

  if (list.length > 1 && id === list[list.length - 2]) {
    list.pop();
    updateBoard();
    return;
  }

  if (!neighbors(last).includes(id)) return;

  const target = drawingFrom === "start" ? drawing.end : drawing.start;

  if (id !== target) {
    const endpoint = getPathAtEndpoint(id);
    if (endpoint && endpoint !== drawing) return;

    const owner = pathOwner(id);
    if (owner && owner !== drawing) return;

    if (list.includes(id)) return;

    list.push(id);
    updateBoard();
    return;
  }

  if (list.includes(id)) return;

  const owner = pathOwner(id);
  if (owner && owner !== drawing) return;

  list.push(id);
  drawing.connected = true;
  drawing = null;
  drawingFrom = null;

  updateBoard();
  checkCompletion();
}

function finishDrawing() {
  if (!drawing) return;

  const path = drawing;
  const target = drawingFrom === "start" ? path.end : path.start;
  const connected = path.cells[path.cells.length - 1] === target;

  if (!connected) {
    path.cells = [];
    path.connected = false;
  }

  drawing = null;
  drawingFrom = null;
  updateBoard();
}

document.addEventListener("pointermove", pointerMove);
document.addEventListener("pointerup", finishDrawing);
document.addEventListener("pointercancel", finishDrawing);

function checkCompletion() {
  if (paths.some(path => !path.connected)) return;

  const used = new Set();

  for (const path of paths) {
    for (const id of path.cells) used.add(id);
  }

  if (used.size !== size * size) return;

  puzzleFinished = true;
  progressLine.style.width = "100%";
  progressLine.classList.add("pulse");
  drawPaths();

  setTimeout(() => {
    if (level >= 10) {
      finalUnlocked = true;
      modalTitle.textContent = "picrews";
      modalText.textContent = "you did it. everything is connected.";
      modalButton.textContent = "unlock";
    } else {
      modalTitle.textContent = "♡";
      modalText.textContent = "everything is connected.";
      modalButton.textContent = "continue";
    }

    modal.classList.add("show");
  }, 650);
}

function updateProgress() {
  progressLine.classList.remove("pulse");
  progressLine.style.width = `${((level - 1) / 10) * 100}%`;
}

function startLevel() {
  puzzleFinished = false;
  drawing = null;
  drawingFrom = null;

  modal.classList.remove("show");
  paths = generatePuzzle();

  updateProgress();
  renderBoard();
}

function nextLevel() {
  modal.classList.remove("show");

  if (finalUnlocked && level >= 10) {
    localStorage.setItem("picrewsUnlocked", "true");
    localStorage.setItem("arcade_picrews_unlocked", "true");
    window.location.href = "inventory.html";
    return;
  }

  level = Math.min(10, level + 1);
  startLevel();
}

function restartLevel() {
  if (modal.classList.contains("show")) return;
  startLevel();
}

document.getElementById("restartButton").addEventListener("click", restartLevel);

document.getElementById("backButton").addEventListener("click", () => {
  if (history.length > 1) {
    history.back();
  } else {
    window.location.href = "index.html";
  }
});

modalButton.addEventListener("click", nextLevel);

makeStars();
startLevel();
</script>
</body>
</html>
