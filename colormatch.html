<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap');

:root {
  --bg: #080d18;
  --blue: #8bbcff;
  --text: #e7edf8;
  --muted: #91a3bf;
  --panel: rgba(17, 29, 49, .74);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100dvh;
  overflow-x: hidden;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 15%, #182b49 0%, transparent 55%),
    linear-gradient(155deg, #080d18, #101c30 65%, #080d18);
  font-family: 'Quicksand', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px 14px;
}

#stars {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  color: #b9d8ff;
  opacity: .45;
  animation: twinkle 4s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .15; transform: scale(.8); }
  to { opacity: .65; transform: scale(1.15); }
}

.page {
  width: 100%;
  max-width: 430px;
  position: relative;
  z-index: 1;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 19px;
}

.small-btn {
  background: rgba(164, 197, 239, .07);
  border: 1px solid rgba(164, 197, 239, .17);
  color: #cbdaf0;
  font-family: 'Quicksand', sans-serif;
  font-size: 11px;
  letter-spacing: 1.5px;
  padding: 9px 13px;
  border-radius: 30px;
  cursor: pointer;
}

.small-btn:active {
  transform: scale(.97);
}

.heading {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: 35px;
  letter-spacing: 2px;
  text-align: center;
  margin: 0 0 5px;
}

.subtitle {
  color: var(--muted);
  text-align: center;
  font-size: 11px;
  letter-spacing: 1.4px;
  margin-bottom: 23px;
}

.panel {
  border: 1px solid rgba(157, 190, 235, .15);
  border-radius: 23px;
  background: var(--panel);
  box-shadow: 0 15px 55px rgba(0, 0, 0, .2);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  padding: 19px 14px 20px;
}

.progress-track {
  height: 3px;
  width: 100%;
  border-radius: 10px;
  background: rgba(150, 185, 230, .12);
  overflow: hidden;
  margin-bottom: 10px;
}

.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 10px;
  background: linear-gradient(90deg, #6599e7, #b4d9ff);
  box-shadow: 0 0 10px rgba(120, 174, 255, .55);
  transition: width .6s ease;
}

.message {
  min-height: 17px;
  text-align: center;
  font-size: 10px;
  color: #a9c8f6;
  letter-spacing: .6px;
  margin-bottom: 17px;
}

.board-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

#board {
  position: relative;
  width: min(100%, 330px, 38dvh);
  aspect-ratio: 1;
  display: grid;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.cell {
  min-width: 0;
  min-height: 0;
  border: 1px solid rgba(145, 179, 224, .09);
  border-radius: 7px;
  background: rgba(10, 19, 34, .4);
  pointer-events: none;
}

.paths-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 2;
}

.path-line {
  fill: none;
  stroke-width: 6.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .98;
  filter: drop-shadow(0 0 2px currentColor);
}

.path-line.completed {
  animation: pathPulse 3.2s ease-in-out infinite;
}

@keyframes pathPulse {
  0%, 100% { opacity: .82; }
  50% { opacity: 1; }
}

.endpoint-ball {
  stroke: rgba(255, 255, 255, .75);
  stroke-width: .7;
  filter: drop-shadow(0 0 2px currentColor);
  pointer-events: none;
}

.bottom-note {
  text-align: center;
  color: #7186a7;
  font-size: 10px;
  letter-spacing: .7px;
  margin-top: 19px;
}

@media (max-width: 420px) {
  #board {
    width: min(100%, 78vw, 36dvh);
  }
}

@media (max-height: 650px) {
  body { padding-top: 10px; padding-bottom: 10px; }
  .heading { font-size: 29px; }
  .subtitle { margin-bottom: 13px; }
  .panel { padding-top: 13px; padding-bottom: 13px; }
  #board { width: min(100%, 36dvh); }
  .bottom-note { margin-top: 11px; }
}
</style>
</head>

<body>
<div id="stars"></div>

<main class="page">
  <div class="topbar">
    <button class="small-btn" onclick="location.href='index.html'">← return</button>
    <button class="small-btn" id="restart">restart ↻</button>
  </div>

  <h1 class="heading">connect the colors</h1>
  <div class="subtitle">♡ connect every pair ♡</div>

  <section class="panel">
    <div class="progress-track">
      <div class="progress-fill" id="progress"></div>
    </div>
    <div class="message" id="message"></div>

    <div class="board-wrap">
      <div id="board"></div>
    </div>

    <div class="bottom-note">connect them all, leave no space behind</div>
  </section>
</main>

<script>
const starBox = document.getElementById('stars');

for (let i = 0; i < 38; i++) {
  const star = document.createElement('span');
  star.className = 'star';
  star.textContent = Math.random() > .5 ? '✦' : '✧';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.fontSize = (5 + Math.random() * 9) + 'px';
  star.style.animationDelay = Math.random() * 4 + 's';
  star.style.animationDuration = (3 + Math.random() * 4) + 's';
  starBox.appendChild(star);
}

const board = document.getElementById('board');
const message = document.getElementById('message');
const progress = document.getElementById('progress');

const COLORS = [
  '#8bbcff',
  '#d6a8ff',
  '#8ee0d0',
  '#ffb9ce',
  '#f6d48d',
  '#aab7ff'
];

const TOTAL_LEVELS = 10;
const LEVEL_KEY = 'connectcolors_completed_levels';
const REWARD_KEY = 'birthday_unlocked_rewards';

let completedLevels = Number(localStorage.getItem(LEVEL_KEY) || 0);
completedLevels = Math.max(0, Math.min(TOTAL_LEVELS, completedLevels));

let level = Math.min(completedLevels + 1, TOTAL_LEVELS);
let size = 5;
let paths = [];
let endpoints = [];
let occupied = new Map();
let drawing = null;
let svg = null;
let solved = false;
let checking = false;
let solution = [];

function cellId(row, col) {
  return row * size + col;
}

function coords(id) {
  return {
    row: Math.floor(id / size),
    col: id % size
  };
}

function center(id) {
  const p = coords(id);
  return {
    x: (p.col + .5) * 100 / size,
    y: (p.row + .5) * 100 / size
  };
}

function neighbors(id) {
  const { row, col } = coords(id);
  const result = [];

  if (row > 0) result.push(cellId(row - 1, col));
  if (row < size - 1) result.push(cellId(row + 1, col));
  if (col > 0) result.push(cellId(row, col - 1));
  if (col < size - 1) result.push(cellId(row, col + 1));

  return result;
}

function makeSolution() {
  size = level <= 4 ? 5 : 6;

  const snake = [];

  for (let row = 0; row < size; row++) {
    if (row % 2 === 0) {
      for (let col = 0; col < size; col++) {
        snake.push(cellId(row, col));
      }
    } else {
      for (let col = size - 1; col >= 0; col--) {
        snake.push(cellId(row, col));
      }
    }
  }

  const colorCount = level <= 2 ? 3 : level <= 5 ? 4 : 5;
  const total = snake.length;
  const chunks = [];
  let start = 0;

  for (let i = 0; i < colorCount; i++) {
    const remaining = total - start;
    const remainingChunks = colorCount - i;
    let length = Math.floor(remaining / remainingChunks);

    if (i === colorCount - 1) length = remaining;

    chunks.push(snake.slice(start, start + length));
    start += length;
  }

  solution = chunks;
  endpoints = chunks.map((cells, i) => ({
    color: COLORS[i],
    start: cells[0],
    end: cells[cells.length - 1],
    solution: cells
  }));
}

function makeBoard() {
  board.innerHTML = '';
  board.style.gridTemplateColumns = `repeat(${size}, minmax(0, 1fr))`;
  board.style.gridTemplateRows = `repeat(${size}, minmax(0, 1fr))`;

  for (let i = 0; i < size * size; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.id = i;
    board.appendChild(cell);
  }

  svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.classList.add('paths-svg');
  board.appendChild(svg);

  endpoints.forEach(path => {
    const start = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    start.setAttribute('cx', center(path.start).x);
    start.setAttribute('cy', center(path.start).y);
    start.setAttribute('r', '4.5');
    start.setAttribute('fill', path.color);
    start.setAttribute('class', 'endpoint-ball');
    start.style.color = path.color;
    svg.appendChild(start);

    const end = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    end.setAttribute('cx', center(path.end).x);
    end.setAttribute('cy', center(path.end).y);
    end.setAttribute('r', '4.5');
    end.setAttribute('fill', path.color);
    end.setAttribute('class', 'endpoint-ball');
    end.style.color = path.color;
    svg.appendChild(end);
  });
}function resetPaths() {
  paths = endpoints.map((endpoint, index) => ({
    color: endpoint.color,
    start: endpoint.start,
    end: endpoint.end,
    cells: [],
    complete: false,
    index
  }));

  occupied = new Map();

  paths.forEach(path => {
    occupied.set(path.start, path.index);
    occupied.set(path.end, path.index);
  });

  solved = false;
  drawing = null;
  checking = false;
  renderPaths();
  updateProgress();
}

function renderPaths() {
  if (!svg) return;

  svg.querySelectorAll('.drawn-path').forEach(el => el.remove());

  paths.forEach(path => {
    if (!path.cells.length) return;

    const all = [path.start, ...path.cells];

    const points = all.map(id => {
      const p = center(id);
      return `${p.x},${p.y}`;
    }).join(' ');

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', points);
    line.setAttribute('stroke', path.color);
    line.setAttribute(
      'class',
      'path-line drawn-path' + (path.complete ? ' completed' : '')
    );
    svg.insertBefore(line, svg.firstChild);
  });
}

function updateProgress() {
  progress.style.width =
    Math.min(100, completedLevels / TOTAL_LEVELS * 100) + '%';

  if (completedLevels >= TOTAL_LEVELS) {
    message.textContent = 'yayyy you unlocked the picrews';
    progress.style.width = '100%';
  } else {
    message.textContent = '';
  }
}

function getCellAtPointer(event) {
  const rect = board.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

  if (x < 0 || y < 0 || x >= rect.width || y >= rect.height) {
    return null;
  }

  const col = Math.floor(x / (rect.width / size));
  const row = Math.floor(y / (rect.height / size));

  if (row < 0 || row >= size || col < 0 || col >= size) {
    return null;
  }

  return cellId(row, col);
}

function pathForStart(id) {
  return paths.find(path => path.start === id);
}

function pathForEnd(id) {
  return paths.find(path => path.end === id);
}

function startDrawing(event) {
  if (solved || checking) return;

  const id = getCellAtPointer(event);
  if (id === null) return;

  const startPath = pathForStart(id);
  const endPath = pathForEnd(id);
  const path = startPath || endPath;

  if (!path) return;

  if (path.complete) {
    path.cells = [];
    path.complete = false;
    occupied.set(path.start, path.index);
    occupied.set(path.end, path.index);
  }

  if (endPath && !startPath) {
    const oldStart = path.start;
    path.start = path.end;
    path.end = oldStart;
  }

  path.cells = [];
  path.complete = false;

  occupied.set(path.start, path.index);
  occupied.set(path.end, path.index);

  drawing = {
    path,
    cells: [path.start]
  };

  try {
    board.setPointerCapture(event.pointerId);
  } catch (_) {}

  event.preventDefault();
  renderPaths();
}

function addCellToDrawing(id) {
  if (!drawing || id === null) return;

  const path = drawing.path;
  const last = drawing.cells[drawing.cells.length - 1];

  if (id === last) return;

  if (
    drawing.cells.length > 1 &&
    id === drawing.cells[drawing.cells.length - 2]
  ) {
    drawing.cells.pop();
    renderDrawing();
    return;
  }

  if (!neighbors(last).includes(id)) return;

  const otherPath = occupied.get(id);

  if (otherPath !== undefined && otherPath !== path.index) {
    if (id === path.end) {
      drawing.cells.push(id);
      finishDrawing();
    }
    return;
  }

  if (id === path.end) {
    drawing.cells.push(id);
    finishDrawing();
    return;
  }

  if (drawing.cells.includes(id)) return;

  drawing.cells.push(id);
  renderDrawing();
}

function renderDrawing() {
  if (!drawing) return;

  const path = drawing.path;
  path.cells = drawing.cells.slice(1);
  path.complete = false;

  occupied = new Map();

  paths.forEach(pathItem => {
    occupied.set(pathItem.start, pathItem.index);
    occupied.set(pathItem.end, pathItem.index);
  });

  paths.forEach(pathItem => {
    pathItem.cells.forEach(id => occupied.set(id, pathItem.index));
  });

  renderPaths();
}

function moveDrawing(event) {
  if (!drawing) return;

  event.preventDefault();

  const id = getCellAtPointer(event);
  if (id === null) return;

  const last = drawing.cells[drawing.cells.length - 1];
  if (id === last) return;

  const from = coords(last);
  const to = coords(id);

  const rowDiff = to.row - from.row;
  const colDiff = to.col - from.col;

  // Make quick diagonal finger movements easier to follow.
  if (rowDiff !== 0 && colDiff !== 0) {
    if (Math.abs(rowDiff) >= Math.abs(colDiff)) {
      addCellToDrawing(cellId(from.row + Math.sign(rowDiff), from.col));
    } else {
      addCellToDrawing(cellId(from.row, from.col + Math.sign(colDiff)));
    }
    return;
  }

  const distance = Math.abs(rowDiff) + Math.abs(colDiff);
  if (distance === 0) return;

  const rowStep = Math.sign(rowDiff);
  const colStep = Math.sign(colDiff);

  // Interpolate across cells if the finger moves quickly.
  for (let i = 1; i <= distance; i++) {
    if (!drawing) break;

    addCellToDrawing(
      cellId(
        from.row + rowStep * i,
        from.col + colStep * i
      )
    );
  }
}

function finishDrawing() {
  if (!drawing) return;

  const path = drawing.path;
  path.cells = drawing.cells.slice(1);
  path.complete = drawing.cells[drawing.cells.length - 1] === path.end;

  drawing = null;
  renderPaths();

  if (paths.every(pathItem => pathItem.complete)) {
    checkBoard();
  }
}

function endDrawing() {
  if (!drawing) return;

  const path = drawing.path;
  path.cells = drawing.cells.slice(1);
  path.complete = drawing.cells[drawing.cells.length - 1] === path.end;

  drawing = null;
  renderPaths();

  if (paths.every(pathItem => pathItem.complete)) {
    checkBoard();
  }
}

function checkBoard() {
  if (checking || solved) return;

  const filled = new Set();

  paths.forEach(path => {
    filled.add(path.start);
    filled.add(path.end);
    path.cells.forEach(id => filled.add(id));
  });

  if (filled.size !== size * size) {
    message.textContent = 'almostt, you need to fill up the entire board';

    setTimeout(() => {
      if (!solved && completedLevels < TOTAL_LEVELS) {
        message.textContent = '';
      }
    }, 2600);

    return;
  }

  checking = true;
  solved = true;

  completedLevels = Math.max(completedLevels, level);
  localStorage.setItem(LEVEL_KEY, String(completedLevels));

  if (completedLevels >= TOTAL_LEVELS) {
    unlockPicrews();
    progress.style.width = '100%';
    message.textContent = 'yayyy you unlocked the picrews';
    checking = false;
    return;
  }

  progress.style.width =
    (completedLevels / TOTAL_LEVELS * 100) + '%';

  setTimeout(() => {
    level = Math.min(completedLevels + 1, TOTAL_LEVELS);
    loadLevel();
  }, 850);
}

function unlockPicrews() {
  let rewards = [];

  try {
    rewards = JSON.parse(localStorage.getItem(REWARD_KEY) || '[]');
    if (!Array.isArray(rewards)) rewards = [];
  } catch (_) {
    rewards = [];
  }

  if (!rewards.includes('picrews')) {
    rewards.push('picrews');
  }

  localStorage.setItem(REWARD_KEY, JSON.stringify(rewards));
  localStorage.setItem('picrewsUnlocked', 'true');
  localStorage.setItem('arcade_picrews_unlocked', 'true');
}

function loadLevel() {
  level = Math.min(level, TOTAL_LEVELS);

  makeSolution();
  makeBoard();
  resetPaths();
  updateProgress();
}

function restartLevel() {
  loadLevel();
}

board.addEventListener('pointerdown', startDrawing);
board.addEventListener('pointermove', moveDrawing);
board.addEventListener('pointerup', endDrawing);
board.addEventListener('pointercancel', endDrawing);

document.getElementById('restart').addEventListener('click', restartLevel);

loadLevel();
</script>
</body>
</html>
