<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #080d18;
}

html {
  overflow-x: hidden;
  overscroll-behavior: none;
}

body {
  min-height: 100dvh;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  background: radial-gradient(ellipse at 50% 45%, #142642 0%, #0d192d 45%, #080d18 100%);
  color: #dce8fa;
  font-family: 'Quicksand', sans-serif;
}

.star-background {
  position: fixed;
  inset: -12%;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 25%, rgba(64,104,165,.13), transparent 35%),
    radial-gradient(circle at 80% 75%, rgba(60,100,165,.12), transparent 38%);
}

.star {
  position: absolute;
  display: block;
  color: #a9caff;
  user-select: none;
  pointer-events: none;
  will-change: transform, opacity;
  animation: drift var(--duration) ease-in-out infinite alternate,
             twinkle var(--twinkle) ease-in-out infinite alternate;
  animation-delay: var(--delay), var(--delay);
}

.star.small, .star.large {
  font-family: 'Cormorant Garamond', serif;
}

.star.small {
  font-size: var(--size);
  opacity: .45;
}

.star.large {
  font-size: var(--size);
  color: rgba(137,178,239,.28);
}

.star.dot {
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: #b9d5ff;
  box-shadow: 0 0 8px rgba(135,180,255,.5);
}

@keyframes drift {
  from { transform: translate3d(-12px,8px,0) rotate(-12deg); }
  to { transform: translate3d(18px,-22px,0) rotate(18deg); }
}

@keyframes twinkle {
  from { opacity: .2; }
  to { opacity: .85; }
}

.floating-star {
  position: fixed;
  z-index: 0;
  pointer-events: none;
  color: rgba(150,190,255,.28);
  font-family: 'Cormorant Garamond', serif;
  line-height: 1;
  animation: float 7s ease-in-out infinite alternate;
}

.floating-star.one {
  top: 12%;
  left: 8%;
  font-size: 58px;
  animation-delay: -2s;
}

.floating-star.two {
  top: 23%;
  right: 9%;
  font-size: 36px;
  animation-delay: -4s;
}

.floating-star.three {
  bottom: 12%;
  left: 13%;
  font-size: 42px;
  animation-delay: -1s;
}

.floating-star.four {
  bottom: 16%;
  right: 11%;
  font-size: 65px;
  animation-delay: -3s;
}

@keyframes float {
  from { transform: translate3d(-8px,10px,0) rotate(-10deg); }
  to { transform: translate3d(12px,-18px,0) rotate(15deg); }
}

header {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 10px max(18px,env(safe-area-inset-left));
}

.nav-button {
  padding: 11px 20px;
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 50px;
  background: rgba(15,28,50,.78);
  color: #dce8fa;
  font-family: 'Quicksand', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: background .25s ease,transform .25s ease;
}

.nav-button:hover {
  background: rgba(65,105,165,.4);
  transform: translateY(-2px);
}

main {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: calc(100dvh - 65px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 18px max(24px,env(safe-area-inset-bottom));
}

.ornament {
  color: #799acb;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  letter-spacing: 10px;
  margin-bottom: 10px;
  animation: softGlow 4s ease-in-out infinite alternate;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(38px,8vw,60px);
  font-weight: 500;
  color: #e1ecff;
  letter-spacing: 2px;
  margin-bottom: 22px;
  text-align: center;
}

.progress-wrap {
  width: min(390px,88%);
  margin: 0 auto 25px;
  text-align: center;
}

.unlock-message {
  min-height: 28px;
  margin-bottom: 11px;
  color: #b9d3ff;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(16px,4.2vw,21px);
  letter-spacing: .5px;
  opacity: 0;
  transform: translateY(5px);
  transition: opacity .45s ease,transform .45s ease;
}

.unlock-message.visible {
  opacity: 1;
  transform: translateY(0);
}

.progress-track {
  position: relative;
  width: 100%;
  height: 4px;
  overflow: hidden;
  border-radius: 20px;
  background: rgba(137,178,239,.16);
  box-shadow: 0 0 12px rgba(82,139,220,.08);
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg,#527dbd,#8fc1ff);
  box-shadow: 0 0 12px rgba(119,174,255,.55);
  transition: width .8s cubic-bezier(.22,.8,.25,1);
}

.progress-fill.pulse {
  animation: progressPulse 3.2s ease-in-out infinite;
}

@keyframes progressPulse {
  0%,100% { opacity: .35; }
  50% { opacity: 1; }
}

.game-container {
  width: min(540px,100%);
  padding: clamp(14px,4vw,25px);
  background: rgba(14,25,44,.76);
  border: 1px solid rgba(180,210,255,.18);
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25),inset 0 0 30px rgba(130,175,255,.04);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  justify-content: center;
  align-items: center;
}

#board {
  position: relative;
  width: min(100%,390px,44dvh);
  aspect-ratio: 1;
  display: grid;
  touch-action: none;
}

.cell {
  min-width: 0;
  min-height: 0;
  border: 1px solid rgba(145,179,224,.09);
  border-radius: 7px;
  background: rgba(10,19,34,.4);
  transition: background .15s ease;
}

.paths-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  pointer-events: none;
  z-index: 2;
}

.path-line {
  fill: none;
  stroke-width: 5.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .95;
  filter: drop-shadow(0 0 2px currentColor);
}

.path-line.completed {
  animation: pathPulse 3.2s ease-in-out infinite;
}

@keyframes pathPulse {
  0%,100% { opacity: .4; }
  50% { opacity: 1; }
}

.endpoint-ball {
  stroke: rgba(255,255,255,.75);
  stroke-width: .7;
  filter: drop-shadow(0 0 2px currentColor);
}

.bottom-ornament {
  margin-top: 22px;
  color: #799acb;
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  letter-spacing: 12px;
  animation: softGlow 4s ease-in-out infinite alternate;
}

@keyframes softGlow {
  from { opacity: .55; }
  to { opacity: 1; }
}

.modal-overlay {
  position: fixed;
  z-index: 10;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(3,7,17,.78);
  padding: 20px;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  width: min(100%,330px);
  padding: 30px 24px;
  text-align: center;
  background: rgba(14,25,44,.96);
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35),inset 0 0 30px rgba(130,175,255,.04);
  backdrop-filter: blur(12px);
}

.modal-title {
  margin: 0 0 24px;
  color: #e1ecff;
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px;
  font-weight: 500;
  letter-spacing: 1px;
}

.next-button {
  min-width: 120px;
  padding: 11px 20px;
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 50px;
  background: rgba(45,76,122,.65);
  color: #e0eaff;
  font-family: 'Quicksand',sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: background .25s ease,transform .25s ease;
}

.next-button:hover {
  background: rgba(65,105,165,.55);
  transform: translateY(-2px);
}

@media (max-width:420px) {
  .floating-star.one { left: 3%; font-size: 42px; }
  .floating-star.two { right: 4%; font-size: 28px; }
  .floating-star.three { left: 5%; font-size: 32px; }
  .floating-star.four { right: 4%; font-size: 45px; }
  .game-container { padding: 12px; border-radius: 22px; }
  #board { width: min(100%,76vw,40dvh); }
  .bottom-ornament { margin-top: 17px; }
}

@media (max-height:650px) {
  main { padding-top: 8px; }
  .ornament { margin-bottom: 3px; font-size: 16px; }
  h1 { font-size: 36px; margin-bottom: 10px; }
  .progress-wrap { margin-bottom: 14px; }
  .game-container { padding: 10px; }
  #board { width: min(100%,38dvh); }
  .bottom-ornament { margin-top: 10px; font-size: 18px; }
}

@media (prefers-reduced-motion:reduce) {
  .star,.floating-star,.ornament,.bottom-ornament {
    animation: none;
  }
  .nav-button,.next-button,.progress-fill {
    transition: none;
  }
}
</style>
</head>
<body>

<div class="star-background" id="starBackground" aria-hidden="true"></div>
<div class="floating-star one" aria-hidden="true">✦</div>
<div class="floating-star two" aria-hidden="true">✧</div>
<div class="floating-star three" aria-hidden="true">✧</div>
<div class="floating-star four" aria-hidden="true">✦</div>

<header>
  <button class="nav-button" id="returnButton" type="button">return</button>
  <button class="nav-button" id="restartButton" type="button">restart</button>
</header>

<main>
  <div class="ornament">✦　⋆　✦</div>
  <h1>♡</h1>

  <div class="progress-wrap">
    <div class="unlock-message" id="unlockMessage"></div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <section class="game-container">
    <div id="board">
      <svg class="paths-svg" id="pathsSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <div class="bottom-ornament">✧　·　✦　·　✧</div>
</main>

<div class="modal-overlay" id="winModal">
  <div class="modal">
    <h2 class="modal-title" id="modalTitle">YAY</h2>
    <button class="next-button" id="nextButton" type="button">next</button>
  </div>
</div>

<script>(() => {
  const TOTAL_LEVELS = 10;
  const PROGRESS_KEY = "connectcolors_completed_levels";
  const REWARD_KEY = "birthday_unlocked_rewards";

  const COLORS = [
    "#8bbdff", "#d3a6ff", "#8ee1d0",
    "#f0b5cf", "#f2d28e", "#a8b5ff"
  ];

  const board = document.getElementById("board");
  const pathsSvg = document.getElementById("pathsSvg");
  const progressFill = document.getElementById("progressFill");
  const unlockMessage = document.getElementById("unlockMessage");
  const winModal = document.getElementById("winModal");
  const modalTitle = document.getElementById("modalTitle");
  const nextButton = document.getElementById("nextButton");

  let completedLevels = Math.max(
    0,
    Math.min(TOTAL_LEVELS, Number(localStorage.getItem(PROGRESS_KEY)) || 0)
  );

  let level = Math.min(completedLevels + 1, TOTAL_LEVELS);
  let size = 5;
  let paths = [];
  let cells = [];
  let drawing = null;
  let drawingFrom = null;
  let puzzleFinished = false;
  let awaitingNext = false;

  const NS = "http://www.w3.org/2000/svg";

  function readRewards() {
    try {
      const value = JSON.parse(localStorage.getItem(REWARD_KEY) || "[]");
      return Array.isArray(value) ? value : [];
    } catch {
      return [];
    }
  }

  function unlockPicrews() {
    const rewards = readRewards();

    if (!rewards.includes("picrews")) {
      rewards.push("picrews");
    }

    localStorage.setItem(REWARD_KEY, JSON.stringify(rewards));
    localStorage.setItem("picrewsUnlocked", "true");
    localStorage.setItem("arcade_picrews_unlocked", "true");
  }

  function updateProgress() {
    const amount = Math.min(completedLevels / TOTAL_LEVELS, 1);
    progressFill.style.width = `${amount * 100}%`;

    if (completedLevels >= TOTAL_LEVELS) {
      unlockPicrews();
    }
  }

  function setMessage(message) {
    unlockMessage.textContent = message;
    unlockMessage.classList.toggle("visible", Boolean(message));
  }

  function makeStars() {
    const background = document.getElementById("starBackground");
    const symbols = ["✦", "✧", "⋆", "·"];

    for (let i = 0; i < 42; i++) {
      const star = document.createElement("span");
      const type = Math.random();

      star.className = "star";

      if (type < .25) {
        star.classList.add("large");
        star.textContent = symbols[Math.floor(Math.random() * 3)];
      } else if (type < .55) {
        star.classList.add("small");
        star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      } else {
        star.classList.add("dot");
      }

      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.setProperty(
        "--size",
        type > .55
          ? (Math.random() * 2 + 1) + "px"
          : (Math.random() * 18 + 8) + "px"
      );
      star.style.setProperty("--duration", (5 + Math.random() * 9) + "s");
      star.style.setProperty("--twinkle", (2 + Math.random() * 4) + "s");
      star.style.setProperty("--delay", (-Math.random() * 10) + "s");

      background.appendChild(star);
    }
  }

  function cellId(row, col) {
    return row * size + col;
  }

  function coords(id) {
    return {
      row: Math.floor(id / size),
      col: id % size
    };
  }

  function neighbors(id) {
    const { row, col } = coords(id);
    const result = [];

    if (row > 0) result.push(cellId(row - 1, col));
    if (row < size - 1) result.push(cellId(row + 1, col));
    if (col > 0) result.push(cellId(row, col - 1));
    if (col < size - 1) result.push(cellId(row, col + 1));

    return result;
  }

  function makeRoute() {
    const route = [];
    const columnMode = Math.random() < .5;

    if (!columnMode) {
      for (let r = 0; r < size; r++) {
        if (r % 2 === 0) {
          for (let c = 0; c < size; c++) route.push(cellId(r, c));
        } else {
          for (let c = size - 1; c >= 0; c--) route.push(cellId(r, c));
        }
      }
    } else {
      for (let c = 0; c < size; c++) {
        if (c % 2 === 0) {
          for (let r = 0; r < size; r++) route.push(cellId(r, c));
        } else {
          for (let r = size - 1; r >= 0; r--) route.push(cellId(r, c));
        }
      }
    }

    if (Math.random() < .5) route.reverse();
    return route;
  }

  function generatePuzzle() {
    size = level <= 3 ? 5 : level <= 6 ? 6 : 7;

    const route = makeRoute();
    const total = size * size;
    const count = Math.min(2 + Math.floor((level - 1) / 2), 6);
    const cuts = [];
    const minimum = 4;

    for (let i = 1; i < count; i++) {
      const ideal = Math.round(total * i / count);
      const low = (cuts.length ? cuts[cuts.length - 1] : 0) + minimum;
      const high = total - (count - i) * minimum;
      const variation = Math.floor(Math.random() * 5) - 2;

      cuts.push(Math.max(low, Math.min(high, ideal + variation)));
    }

    const bounds = [0, ...cuts, total];

    return Array.from({ length: count }, (_, i) => {
      const solution = route.slice(bounds[i], bounds[i + 1]);

      return {
        color: COLORS[i],
        start: solution[0],
        end: solution[solution.length - 1],
        solution,
        cells: [],
        connected: false
      };
    });
  }

  function svgElement(name, attributes) {
    const element = document.createElementNS(NS, name);

    Object.entries(attributes).forEach(([key, value]) => {
      element.setAttribute(key, value);
    });

    return element;
  }

  function pointFor(id) {
    const { row, col } = coords(id);

    return {
      x: ((col + .5) / size) * 100,
      y: ((row + .5) / size) * 100
    };
  }

  function rgba(hex, alpha) {
    const value = parseInt(hex.slice(1), 16);
    return `rgba(${(value >> 16) & 255},${(value >> 8) & 255},${value & 255},${alpha})`;
  }

  function renderBoard() {
    board.querySelectorAll(".cell").forEach(cell => cell.remove());
    pathsSvg.innerHTML = "";
    cells = [];

    board.style.gridTemplateColumns = `repeat(${size},1fr)`;
    board.style.gridTemplateRows = `repeat(${size},1fr)`;

    for (let id = 0; id < size * size; id++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.id = id;
      cell.addEventListener("pointerdown", startDrawing);

      board.insertBefore(cell, pathsSvg);
      cells.push(cell);
    }

    updateBoard();
  }

  function updateBoard() {
    cells.forEach(cell => {
      cell.style.background = "";
    });

    paths.forEach(path => {
      path.cells.forEach(id => {
        if (cells[id]) {
          cells[id].style.background = rgba(path.color, .13);
        }
      });
    });

    drawPaths();
  }

  function drawPaths() {
    pathsSvg.innerHTML = "";

    paths.forEach(path => {
      if (path.cells.length > 1) {
        const points = path.cells.map(pointFor);
        const d = points.map((point, i) =>
          `${i === 0 ? "M" : "L"} ${point.x} ${point.y}`
        ).join(" ");

        pathsSvg.appendChild(svgElement("path", {
          d,
          stroke: path.color,
          class: "path-line" + (puzzleFinished ? " completed" : "")
        }));
      }

      [path.start, path.end].forEach(id => {
        const point = pointFor(id);

        pathsSvg.appendChild(svgElement("circle", {
          cx: point.x,
          cy: point.y,
          r: 3.8,
          fill: path.color,
          class: "endpoint-ball"
        }));
      });
    });
  }

  function pathAtEndpoint(id) {
    return paths.find(path => path.start === id || path.end === id);
  }

  function pathOwningCell(id) {
    return paths.find(path => path.cells.includes(id));
  }

  function startDrawing(event) {
    if (puzzleFinished) return;

    const id = Number(event.currentTarget.dataset.id);
    const path = pathAtEndpoint(id);

    if (!path) return;

    if (path.connected) {
      path.cells = [];
      path.connected = false;
    }

    if (paths.some(other => other !== path && other.cells.includes(id))) return;

    drawing = path;
    drawingFrom = id === path.start ? "start" : "end";
    path.cells = [id];

    setMessage("");
    event.preventDefault();
    updateBoard();
  }

  function getCellAtPointer(event) {
    const element = document.elementFromPoint(event.clientX, event.clientY);
    const cell = element?.closest(".cell");

    if (!cell || !board.contains(cell)) return null;

    return Number(cell.dataset.id);
  }

  function moveDrawing(event) {
    if (!drawing || puzzleFinished) return;

    const id = getCellAtPointer(event);
    if (id === null) return;

    const list = drawing.cells;
    const last = list[list.length - 1];

    if (id === last) return;

    if (list.length > 1 && id === list[list.length - 2]) {
      list.pop();
      updateBoard();
      return;
    }

    if (!neighbors(last).includes(id)) return;

    const target = drawingFrom === "start" ? drawing.end : drawing.start;

    if (id !== target) {
      const endpoint = pathAtEndpoint(id);
      if (endpoint && endpoint !== drawing) return;

      const owner = pathOwningCell(id);
      if (owner && owner !== drawing) return;

      if (list.includes(id)) return;

      list.push(id);
      updateBoard();
      return;
    }

    if (list.includes(id)) return;

    const owner = pathOwningCell(id);
    if (owner && owner !== drawing) return;

    list.push(id);
    drawing.connected = true;
    drawing = null;
    drawingFrom = null;

    updateBoard();
    checkCompletion();
  }

  function endDrawing() {
    if (!drawing) return;

    const path = drawing;
    const target = drawingFrom === "start" ? path.end : path.start;
    const reachedTarget = path.cells[path.cells.length - 1] === target;

    if (!reachedTarget) {
      path.cells = [];
      path.connected = false;
    }

    drawing = null;
    drawingFrom = null;
    updateBoard();
  }

  function checkCompletion() {
    const allConnected = paths.every(path => path.connected);

    if (!allConnected) {
      setMessage("");
      return;
    }

    const usedCells = new Set();

    paths.forEach(path => path.cells.forEach(id => usedCells.add(id)));

    if (usedCells.size < size * size) {
      setMessage("almostt, you need to fill up the entire board");
      return;
    }

    if (usedCells.size !== size * size) return;

    puzzleFinished = true;
    completedLevels = Math.max(completedLevels, level);
    localStorage.setItem(PROGRESS_KEY, String(completedLevels));
    updateProgress();

    if (completedLevels >= TOTAL_LEVELS) {
      unlockPicrews();
      setMessage("yayyy you unlocked the picrews");
      progressFill.classList.add("pulse");
      modalTitle.textContent = "yayyy you unlocked the picrews";
      nextButton.textContent = "done";
    } else {
      setMessage("");
      progressFill.classList.remove("pulse");
      modalTitle.textContent = "yayyy";
      nextButton.textContent = "next";
    }

    drawPaths();

    setTimeout(() => {
      winModal.classList.add("show");
    }, 450);
  }

  function startLevel() {
    puzzleFinished = false;
    drawing = null;
    drawingFrom = null;
    setMessage("");
    winModal.classList.remove("show");
    progressFill.classList.remove("pulse");

    paths = generatePuzzle();
    renderBoard();
    updateProgress();
  }

  function nextLevel() {
    winModal.classList.remove("show");

    if (completedLevels >= TOTAL_LEVELS) {
      unlockPicrews();
      setMessage("yayyy you unlocked the picrews");
      return;
    }

    level = completedLevels + 1;
    startLevel();
  }

  function restartLevel() {
    if (winModal.classList.contains("show")) return;
    startLevel();
  }

  document.addEventListener("pointermove", moveDrawing);
  document.addEventListener("pointerup", endDrawing);
  document.addEventListener("pointercancel", endDrawing);

  document.getElementById("restartButton").addEventListener("click", restartLevel);

  document.getElementById("returnButton").addEventListener("click", () => {
    window.location.href = "index.html";
  });

  nextButton.addEventListener("click", nextLevel);

  makeStars();

  if (completedLevels >= TOTAL_LEVELS) {
    level = TOTAL_LEVELS;
    unlockPicrews();
    setMessage("yayyy you unlocked the picrews");
  }

  startLevel();
})();
</script>
</body>
</html>
