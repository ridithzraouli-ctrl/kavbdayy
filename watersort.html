<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Sort</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #080d1c;
  --panel: #101a31;
  --line: #253758;
  --text: #e8f0ff;
  --muted: #92a5c9;
  --blue: #6ba9ff;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: Georgia, serif;
}

body {
  min-height: 100dvh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

header {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 18px;
}

button {
  font-family: inherit;
  cursor: pointer;
  color: var(--text);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 16px;
  font-size: 15px;
  transition: background .2s, transform .2s;
}

button:active {
  transform: scale(.96);
}

button:hover {
  background: #192744;
}

#levelDisplay {
  text-align: center;
  color: var(--muted);
  font-size: 15px;
  padding: 4px 16px 12px;
  min-height: 35px;
}

#game {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 12px 16px 30px;
}

#bottles {
  width: min(100%, 760px);
  display: flex;
  justify-content: center;
  align-items: center;
  align-content: center;
  flex-wrap: wrap;
  gap: clamp(20px, 4vw, 34px);
}

.bottle {
  position: relative;
  width: clamp(48px, 10vw, 66px);
  height: clamp(142px, 26vw, 190px);
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  flex-shrink: 0;
  overflow: visible;
}

.bottle:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 5px;
  border-radius: 18px;
}

.bottle.selected {
  transform: translateY(-12px);
}

.bottle-shell {
  position: absolute;
  inset: 0 2px 0;
  overflow: hidden;
  border: 2px solid rgba(174, 205, 255, .7);
  border-top: 0;
  border-radius: 5px 5px 18px 18px;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,.10),
    rgba(255,255,255,.015) 30%,
    rgba(255,255,255,.02) 70%,
    rgba(255,255,255,.11)
  );
  box-shadow: inset 0 0 12px rgba(115, 171, 255, .08);
}

.bottle-shell::before {
  content: "";
  position: absolute;
  z-index: 3;
  top: 0;
  left: -2px;
  right: -2px;
  height: 8px;
  border: 2px solid rgba(174, 205, 255, .75);
  border-radius: 5px;
  background: var(--bg);
}

.liquid {
  position: absolute;
  z-index: 1;
  left: 2px;
  right: 2px;
  top: 9px;
  bottom: 2px;
  display: flex;
  flex-direction: column-reverse;
  overflow: hidden;
  border-radius: 0 0 14px 14px;
}

.segment {
  flex: 0 0 25%;
  width: 100%;
  min-height: 0;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  position: relative;
  transition: background-color .22s ease;
}

/* Hide the boundaries between units so each color looks continuous. */
.segment + .segment {
  margin-top: 0;
  border-top: 0;
}

.segment.top-liquid {
  border-radius: 0;
}

.segment.top-liquid::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 7px;
  border-radius: 50%;
  background: inherit;
  filter: brightness(1.08);
  opacity: .95;
}

.bottle-shell .shine {
  position: absolute;
  z-index: 4;
  top: 13px;
  bottom: 12px;
  left: 6px;
  width: 3px;
  border-radius: 8px;
  background: rgba(255,255,255,.17);
  pointer-events: none;
}

.modal-overlay {
  position: fixed;
  z-index: 10;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(3, 7, 17, .78);
  padding: 20px;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  width: min(100%, 330px);
  padding: 30px 24px;
  text-align: center;
  background: #101a31;
  border: 1px solid #30476e;
  border-radius: 20px;
  box-shadow: 0 18px 70px rgba(0,0,0,.35);
}

.modal-title {
  margin: 0 0 24px;
  color: #dceaff;
  font-size: 30px;
  font-weight: normal;
  letter-spacing: 2px;
}

.next-button {
  min-width: 120px;
  background: #203b64;
  border-color: #41699f;
}

@media (max-width: 420px) {
  header {
    padding: 13px 12px;
  }

  button {
    padding: 9px 12px;
    font-size: 14px;
  }

  #bottles {
    gap: 20px 18px;
  }
}
</style>
</head>
<body>

<header>
  <button id="returnButton" type="button">return</button>
  <button id="restartButton" type="button">restart</button>
</header>

<div id="levelDisplay">1/10</div>

<main id="game">
  <div id="bottles"></div>
</main>

<div class="modal-overlay" id="winModal">
  <div class="modal">
    <h1 class="modal-title" id="modalTitle">YAY</h1>
    <button class="next-button" id="nextButton" type="button">next</button>
  </div>
</div>

<script>(() => {
  const UNLOCK_LEVEL = 10;
  const REWARD_KEY = "birthday_unlocked_rewards";
  const RETURN_PAGE = "index.html";

  const colors = [
    "#ff668a", "#69c8ff", "#b18aff", "#ffd166",
    "#62dfbd", "#ff9c66", "#f28ce5", "#8ca8ff",
    "#c6e879", "#ff7b73", "#69e0e8", "#d5a0ff"
  ];

  const bottlesElement = document.getElementById("bottles");
  const levelDisplay = document.getElementById("levelDisplay");
  const winModal = document.getElementById("winModal");
  const nextButton = document.getElementById("nextButton");

  let level = 1;
  let bottles = [];
  let selectedBottle = null;
  let locked = false;
  let rewardShown = false;

  function readRewards() {
    try {
      const data = JSON.parse(localStorage.getItem(REWARD_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }

  function unlockLetters() {
    const rewards = readRewards();

    if (!rewards.includes("letters")) {
      rewards.push("letters");
      localStorage.setItem(REWARD_KEY, JSON.stringify(rewards));
    }
  }

  function updateLevelDisplay() {
    if (level === UNLOCK_LEVEL && rewardShown) {
      levelDisplay.textContent = "yayyy you unlocked the letters";
    } else if (level > UNLOCK_LEVEL) {
      levelDisplay.textContent = `bonus ${level}`;
    } else {
      levelDisplay.textContent = `${level}/${UNLOCK_LEVEL}`;
    }
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function createLevel() {
    selectedBottle = null;
    locked = false;
    rewardShown = false;

    const colorCount = Math.min(3 + Math.floor((level - 1) / 2), colors.length);
    const chosenColors = colors.slice(0, colorCount);
    const units = [];

    chosenColors.forEach((color, index) => {
      for (let i = 0; i < 4; i++) {
        units.push({ color, id: index });
      }
    });

    shuffle(units);

    bottles = [];
    for (let i = 0; i < colorCount; i++) {
      bottles.push(units.slice(i * 4, (i + 1) * 4));
    }

    // Shuffle the units between the filled bottles.
    const mixed = shuffle(bottles.flat());
    bottles = [];

    for (let i = 0; i < colorCount; i++) {
      bottles.push(mixed.slice(i * 4, (i + 1) * 4));
    }

    bottles.push([]);
    bottles.push([]);

    renderBottles();
    updateLevelDisplay();
  }

  function renderBottles() {
    bottlesElement.innerHTML = "";

    bottles.forEach((bottle, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "bottle";
      button.setAttribute("aria-label", `Bottle ${index + 1}`);

      if (selectedBottle === index) {
        button.classList.add("selected");
      }

      const shell = document.createElement("div");
      shell.className = "bottle-shell";

      const liquid = document.createElement("div");
      liquid.className = "liquid";

      bottle.forEach((unit, unitIndex) => {
        const segment = document.createElement("div");
        segment.className = "segment";
        segment.style.backgroundColor = unit.color;

        if (unitIndex === bottle.length - 1) {
          segment.classList.add("top-liquid");
        }

        liquid.appendChild(segment);
      });

      const shine = document.createElement("div");
      shine.className = "shine";

      shell.appendChild(liquid);
      shell.appendChild(shine);
      button.appendChild(shell);

      button.addEventListener("click", () => handleBottleClick(index));
      bottlesElement.appendChild(button);
    });
  }

  function canPour(fromIndex, toIndex) {
    if (fromIndex === toIndex) return false;

    const from = bottles[fromIndex];
    const to = bottles[toIndex];

    if (!from || from.length === 0 || to.length >= 4) return false;
    if (to.length === 0) return true;

    return from[from.length - 1].color === to[to.length - 1].color;
  }

  function handleBottleClick(index) {
    if (locked) return;

    if (selectedBottle === null) {
      if (bottles[index].length > 0) {
        selectedBottle = index;
        renderBottles();
      }
      return;
    }

    if (selectedBottle === index) {
      selectedBottle = null;
      renderBottles();
      return;
    }

    if (canPour(selectedBottle, index)) {
      pourWater(selectedBottle, index);
      return;
    }

    if (bottles[index].length > 0) {
      selectedBottle = index;
    } else {
      selectedBottle = null;
    }

    renderBottles();
  }

  function pourWater(fromIndex, toIndex) {
    const from = bottles[fromIndex];
    const to = bottles[toIndex];
    const topColor = from[from.length - 1].color;

    while (
      from.length > 0 &&
      from[from.length - 1].color === topColor &&
      to.length < 4
    ) {
      to.push(from.pop());
    }

    selectedBottle = null;
    renderBottles();

    if (checkWin()) {
      showWin();
    }
  }

  function checkWin() {
    return bottles.every(bottle => {
      if (bottle.length === 0) return true;
      if (bottle.length !== 4) return false;

      return bottle.every(unit => unit.color === bottle[0].color);
    });
  }

  function showWin() {
    locked = true;

    if (level >= UNLOCK_LEVEL) {
      unlockLetters();
      rewardShown = true;
      levelDisplay.textContent = "yayyy you unlocked the letters";
    }

    document.getElementById("modalTitle").textContent = "YAY";
    winModal.classList.add("show");
  }

  function nextLevel() {
    winModal.classList.remove("show");
    level++;
    createLevel();
  }

  document.getElementById("restartButton").addEventListener("click", () => {
    winModal.classList.remove("show");
    createLevel();
  });

  document.getElementById("returnButton").addEventListener("click", () => {
    window.location.href = RETURN_PAGE;
  });

  nextButton.addEventListener("click", nextLevel);

  createLevel();
})();
</script>
</body>
</html>
