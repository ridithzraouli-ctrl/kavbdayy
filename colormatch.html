
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #080d18;
}

body {
  min-height: 100dvh;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: max(70px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
  color: #dce8fa;
  font-family: 'Quicksand', sans-serif;
  background:
    radial-gradient(ellipse at 50% 43%, rgba(31,60,101,.48), transparent 48%),
    radial-gradient(ellipse at 8% 12%, rgba(57,91,143,.13), transparent 34%),
    radial-gradient(ellipse at 92% 86%, rgba(49,78,128,.13), transparent 36%),
    linear-gradient(145deg, #0c1525, #080d18 55%, #070b14);
}

body::before,
body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  border-radius: 50%;
  z-index: 0;
}

body::before {
  width: 260px;
  height: 260px;
  top: -130px;
  right: -95px;
  border: 1px solid rgba(143,193,255,.06);
  box-shadow: 0 0 0 26px rgba(143,193,255,.018), 0 0 0 58px rgba(143,193,255,.012);
}

body::after {
  width: 210px;
  height: 210px;
  bottom: -125px;
  left: -90px;
  border: 1px solid rgba(143,193,255,.06);
  box-shadow: 0 0 0 24px rgba(143,193,255,.016), 0 0 0 52px rgba(143,193,255,.01);
}

#starfield {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #c4ddff;
  opacity: var(--opacity);
  box-shadow: 0 0 7px rgba(143,193,255,.65);
  animation: twinkle var(--duration) ease-in-out infinite;
  animation-delay: var(--delay);
}

.star.cross {
  width: 7px;
  height: 7px;
  background: transparent;
  box-shadow: none;
  opacity: .2;
}

.star.cross::before,
.star.cross::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #b8d5ff;
  border-radius: 4px;
}

.star.cross::before {
  width: 1px;
  height: 7px;
}

.star.cross::after {
  width: 7px;
  height: 1px;
}

@keyframes twinkle {
  0%, 100% { opacity: calc(var(--opacity) * .45); transform: scale(.8); }
  50% { opacity: var(--opacity); transform: scale(1.25); }
}

#returnButton,
#restartButton {
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  padding: 9px 15px;
  border: 1px solid rgba(180,210,255,.2);
  border-radius: 50px;
  background: rgba(15,28,50,.65);
  color: #dce8fa;
  font: 11px 'Quicksand', sans-serif;
  letter-spacing: 1.5px;
  cursor: pointer;
  z-index: 5;
  backdrop-filter: blur(8px);
  transition: background .25s, border-color .25s;
}

#returnButton { left: 16px; }
#restartButton { right: 16px; }

#returnButton:active,
#restartButton:active {
  background: rgba(65,105,165,.4);
  border-color: rgba(180,210,255,.42);
}

.game {
  position: relative;
  z-index: 1;
  width: min(100%, 440px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.message {
  min-height: 29px;
  width: 100%;
  text-align: center;
  color: #b9d3ff;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(17px, 4.5vw, 22px);
  letter-spacing: .7px;
  opacity: 0;
  transition: opacity .45s ease, text-shadow .45s ease;
  text-shadow: 0 0 5px rgba(143,193,255,.1);
}

.message.visible {
  opacity: .92;
  animation: gentleGlow 3.2s ease-in-out infinite;
}

#unlockMessage {
  color: #c6deff;
  display: none;
}

#unlockMessage.visible {
  display: block;
  opacity: .96;
  animation: gentleGlow 3.2s ease-in-out infinite;
}

@keyframes gentleGlow {
  0%, 100% {
    text-shadow: 0 0 5px rgba(143,193,255,.13);
    opacity: .78;
  }
  50% {
    text-shadow: 0 0 12px rgba(143,193,255,.34);
    opacity: 1;
  }
}

.progress-track {
  width: 100%;
  height: 2px;
  overflow: hidden;
  border-radius: 10px;
  background: rgba(137,178,239,.15);
  box-shadow: 0 0 10px rgba(82,139,220,.08);
  margin-top: -10px;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #527dbd, #8fc1ff);
  box-shadow: 0 0 9px rgba(119,174,255,.5);
  transition: width .55s ease;
}

.board-shell {
  position: relative;
  width: min(88vw, 390px);
  aspect-ratio: 1;
  padding: 9px;
}

.board-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 10px;
  border: 1px solid rgba(180,210,255,.16);
  border-radius: 19px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(90,132,192,.09), transparent 70%),
    rgba(14,25,44,.52);
  box-shadow:
    0 15px 45px rgba(0,0,0,.2),
    0 0 28px rgba(64,113,183,.055),
    inset 0 0 22px rgba(130,175,255,.035);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.board-wrap::before,
.board-wrap::after {
  content: "";
  position: absolute;
  width: 21px;
  height: 21px;
  pointer-events: none;
  border-color: rgba(158,195,250,.38);
  border-style: solid;
  z-index: 3;
}

.board-wrap::before {
  top: 5px;
  left: 5px;
  border-width: 1px 0 0 1px;
  border-top-left-radius: 8px;
}

.board-wrap::after {
  right: 5px;
  bottom: 5px;
  border-width: 0 1px 1px 0;
  border-bottom-right-radius: 8px;
}

#board {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  gap: 0;
  touch-action: none;
}

.cell {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cell::after {
  content: "";
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(153,190,243,.17);
  transition: background .15s;
}

.cell.path-filled::after {
  background: rgba(220,236,255,.22);
}

.endpoint {
  position: relative;
  z-index: 2;
  width: 42%;
  height: 42%;
  min-width: 11px;
  min-height: 11px;
  max-width: 24px;
  max-height: 24px;
  border-radius: 50%;
  border: 2px solid var(--color);
  background: var(--color);
  box-shadow: 0 0 8px color-mix(in srgb, var(--color) 35%, transparent),
              0 0 18px color-mix(in srgb, var(--color) 15%, transparent);
}

.endpoint::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: rgba(8,13,24,.24);
}

.endpoint.connected {
  box-shadow: 0 0 9px color-mix(in srgb, var(--color) 48%, transparent),
              0 0 20px color-mix(in srgb, var(--color) 22%, transparent);
}

#lines {
  position: absolute;
  inset: 10px;
  width: calc(100% - 20px);
  height: calc(100% - 20px);
  overflow: visible;
  pointer-events: none;
  z-index: 1;
}

.path-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: .68;
  opacity: .91;
  filter: drop-shadow(0 0 1.7px currentColor);
}

.path-line.preview {
  opacity: .78;
  stroke-dasharray: .12 .1;
}

.board-shell .ornament {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #a9ceff;
  opacity: .35;
  box-shadow: 0 0 8px rgba(143,193,255,.6);
}

.ornament.a { top: 0; left: 50%; }
.ornament.b { bottom: 0; right: 50%; }
.ornament.c { top: 50%; left: 0; }
.ornament.d { top: 50%; right: 0; }

#spaceMessage {
  min-height: 22px;
  width: 100%;
  text-align: center;
  color: #b9d3ff;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(15px, 4vw, 19px);
  letter-spacing: .5px;
  opacity: 0;
  transition: opacity .4s ease;
  pointer-events: none;
}

#spaceMessage.visible {
  opacity: .92;
  animation: gentleGlow 3.2s ease-in-out infinite;
}

#win {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: rgba(3,7,17,.76);
  backdrop-filter: blur(8px);
}

#win.show {
  display: flex;
}

.win-inner {
  width: min(100%, 300px);
  padding: 30px 20px;
  text-align: center;
  border: 1px solid rgba(180,210,255,.23);
  border-radius: 22px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(76,113,171,.17), transparent 70%),
    rgba(14,25,44,.97);
  box-shadow: 0 20px 60px rgba(0,0,0,.3), 0 0 30px rgba(84,136,204,.07);
  animation: modalIn .35s ease both;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

#winTitle {
  margin-bottom: 20px;
  color: #e1ecff;
  font: 500 34px 'Cormorant Garamond', serif;
  letter-spacing: 2px;
}

#winSubtitle {
  margin: -10px 0 20px;
  color: #9db8df;
  font-size: 12px;
  line-height: 1.7;
}

#nextButton {
  padding: 10px 23px;
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 50px;
  background: rgba(45,76,122,.55);
  color: #e0eaff;
  font: 12px 'Quicksand', sans-serif;
  letter-spacing: 2px;
  cursor: pointer;
}

#nextButton:active {
  background: rgba(68,105,160,.65);
}

@media (max-width: 420px) {
  .game { gap: 15px; }
  .board-shell { width: min(88vw, 360px); padding: 7px; }
  .board-wrap { padding: 8px; }
  #lines {
    inset: 8px;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
  }
}

@media (max-height: 650px) {
  body { padding-top: 60px; padding-bottom: 12px; }
  .game { gap: 10px; }
  .board-shell { width: min(78vw, 330px); }
}

@media (prefers-reduced-motion: reduce) {
  .message.visible,
  #unlockMessage.visible,
  #spaceMessage.visible { animation: none; }
  .progress-fill, .star { transition: none; animation: none; }
}
</style>
</head>

<body>
<div id="starfield" aria-hidden="true"></div>

<button id="returnButton" type="button">return</button>
<button id="restartButton" type="button">restart</button>

<main class="game">
  <div class="message" id="message">almosttt, you need to occupy the entire space</div>
  <div class="message" id="unlockMessage">yayyy you unlocked the picrews</div>

  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="board-shell">
    <span class="ornament a"></span>
    <span class="ornament b"></span>
    <span class="ornament c"></span>
    <span class="ornament d"></span>

    <div class="board-wrap" id="boardWrap">
      <div id="board"></div>
      <svg id="lines" viewBox="0 0 5 5" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div id="spaceMessage">almosttt, you need to occupy the entire space</div>
</main>

<div id="win">
  <div class="win-inner">
    <h2 id="winTitle">YAY</h2>
    <div id="winSubtitle"></div>
    <button id="nextButton" type="button">next</button>
  </div>
</div>

<script>
  
(() => {
  const TOTAL_LEVELS = 10;
  const REWARD_KEY = "birthday_unlocked_rewards";
  const PROGRESS_KEY = "colormatch_completed_levels";
  const RETURN_PAGE = "index.html";

  const palette = [
    "#ff668a",
    "#69c8ff",
    "#b18aff",
    "#ffd166",
    "#62dfbd",
    "#ff9c66"
  ];

  const levelDesigns = [
    { size: 5, colors: 3, route: "rows",       cuts: [1, 3, 2] },
    { size: 5, colors: 3, route: "columns",    cuts: [3, 1, 2] },
    { size: 5, colors: 4, route: "spiral",     cuts: [2, 4, 1, 3] },
    { size: 5, colors: 4, route: "rowsFlip",   cuts: [4, 1, 3, 2] },
    { size: 6, colors: 4, route: "columns",    cuts: [1, 4, 2, 3] },
    { size: 6, colors: 4, route: "spiral",     cuts: [3, 1, 4, 2] },
    { size: 6, colors: 5, route: "rowsFlip",   cuts: [2, 4, 1, 3, 2] },
    { size: 6, colors: 5, route: "columnsFlip", cuts: [4, 1, 3, 2, 5] },
    { size: 6, colors: 6, route: "spiralFlip", cuts: [1, 4, 2, 5, 3, 2] },
    { size: 6, colors: 6, route: "rows",       cuts: [4, 2, 5, 1, 3, 2] }
  ];

  const board = document.getElementById("board");
  const boardWrap = document.getElementById("boardWrap");
  const svg = document.getElementById("lines");
  const message = document.getElementById("message");
  const unlockMessage = document.getElementById("unlockMessage");
  const spaceMessage = document.getElementById("spaceMessage");
  const progressFill = document.getElementById("progressFill");
  const win = document.getElementById("win");
  const winTitle = document.getElementById("winTitle");
  const winSubtitle = document.getElementById("winSubtitle");
  const nextButton = document.getElementById("nextButton");

  let completed = Math.max(
    0,
    Math.min(TOTAL_LEVELS, Number(localStorage.getItem(PROGRESS_KEY)) || 0)
  );

  let level = completed >= TOTAL_LEVELS ? TOTAL_LEVELS + 1 : completed + 1;
  let size = 5;
  let paths = [];
  let endpoints = new Map();
  let drawing = null;
  let occupied = new Map();
  let locked = false;
  let messageTimer = null;

  function makeStars() {
    const field = document.getElementById("starfield");
    field.innerHTML = "";

    for (let i = 0; i < 42; i++) {
      const star = document.createElement("span");
      const cross = i % 9 === 0;

      star.className = cross ? "star cross" : "star";
      star.style.left = `${(i * 37 + 11) % 100}%`;
      star.style.top = `${(i * 61 + 7) % 100}%`;
      star.style.setProperty("--opacity", cross ? ".3" : ".23");
      star.style.setProperty("--duration", `${3 + (i % 5) * .7}s`);
      star.style.setProperty("--delay", `${-(i % 7) * .6}s`);
      field.appendChild(star);
    }
  }

  function isUnlocked() {
    return completed >= TOTAL_LEVELS;
  }

  function saveReward() {
    try {
      const rewards = JSON.parse(localStorage.getItem(REWARD_KEY) || "[]");

      if (Array.isArray(rewards)) {
        if (!rewards.includes("picrews")) rewards.push("picrews");
        localStorage.setItem(REWARD_KEY, JSON.stringify(rewards));
      } else {
        localStorage.setItem(REWARD_KEY, JSON.stringify(["picrews"]));
      }
    } catch {
      localStorage.setItem(REWARD_KEY, JSON.stringify(["picrews"]));
    }
  }

  
function updateProgress() {
  const progress = Math.min(completed, 10);
  progressFill.style.width = `${progress * 10}%`;

  if (progress >= 10) {
    unlockMessage.textContent = "yayyy you unlocked the picrews";
    unlockMessage.classList.add("visible");
  } else {
    unlockMessage.classList.remove("visible");
  }
}


  function showSpaceMessage() {
    if (isUnlocked()) {
      spaceMessage.classList.add("visible");
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        spaceMessage.classList.remove("visible");
      }, 3200);
    } else {
      message.dataset.show = "true";
      message.classList.add("visible");
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => {
        message.dataset.show = "false";
        message.classList.remove("visible");
      }, 3200);
    }
  }

  function rowSnake() {
    const result = [];

    for (let row = 0; row < size; row++) {
      if (row % 2 === 0) {
        for (let col = 0; col < size; col++) result.push(row * size + col);
      } else {
        for (let col = size - 1; col >= 0; col--) result.push(row * size + col);
      }
    }

    return result;
  }

  function columnSnake() {
    const result = [];

    for (let col = 0; col < size; col++) {
      if (col % 2 === 0) {
        for (let row = 0; row < size; row++) result.push(row * size + col);
      } else {
        for (let row = size - 1; row >= 0; row--) result.push(row * size + col);
      }
    }

    return result;
  }

  function spiralRoute() {
    const result = [];
    let top = 0;
    let bottom = size - 1;
    let left = 0;
    let right = size - 1;

    while (top <= bottom && left <= right) {
      for (let col = left; col <= right; col++) result.push(top * size + col);
      top++;

      for (let row = top; row <= bottom; row++) result.push(row * size + right);
      right--;

      if (top <= bottom) {
        for (let col = right; col >= left; col--) result.push(bottom * size + col);
        bottom--;
      }

      if (left <= right) {
        for (let row = bottom; row >= top; row--) result.push(row * size + left);
        left++;
      }
    }

    return result;
  }

  function makeRoute(type) {
    let route;

    if (type === "columns" || type === "columnsFlip") {
      route = columnSnake();
    } else if (type === "spiral" || type === "spiralFlip") {
      route = spiralRoute();
    } else {
      route = rowSnake();
    }

    if (type.endsWith("Flip")) route.reverse();
    return route;
  }

  function splitRoute(route, count, weights) {
    const lengths = Array(count).fill(2);
    const remaining = route.length - count * 2;
    const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);

    const shares = weights.map(weight => {
      const exact = remaining * weight / totalWeight;
      return { whole: Math.floor(exact), fraction: exact - Math.floor(exact) };
    });

    shares.forEach((share, index) => {
      lengths[index] += share.whole;
    });

    const leftover = route.length - lengths.reduce((sum, length) => sum + length, 0);

    const order = shares
      .map((share, index) => ({ index, fraction: share.fraction }))
      .sort((a, b) => b.fraction - a.fraction);

    for (let i = 0; i < leftover; i++) {
      lengths[order[i % order.length].index]++;
    }

    const chunks = [];
    let cursor = 0;

    lengths.forEach(length => {
      chunks.push(route.slice(cursor, cursor + length));
      cursor += length;
    });

    return chunks;
  }

  function makeSolution() {
    const designIndex = (level - 1) % TOTAL_LEVELS;
    const design = levelDesigns[designIndex];
    size = design.size;

    const route = makeRoute(design.route);
    const chunks = splitRoute(route, design.colors, design.cuts);

    paths = chunks.map((cells, index) => ({
      index,
      color: palette[index],
      start: cells[0],
      end: cells[cells.length - 1],
      cells: [],
      complete: false
    }));

    endpoints = new Map();

    paths.forEach(path => {
      endpoints.set(path.start, { pathIndex: path.index, color: path.color });
      endpoints.set(path.end, { pathIndex: path.index, color: path.color });
    });
  }

  function renderBoard() {
    board.innerHTML = "";
    board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    board.style.gridTemplateRows = `repeat(${size}, 1fr)`;
    svg.setAttribute("viewBox", `0 0 ${size} ${size}`);

    for (let index = 0; index < size * size; index++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.index = index;

      if (endpoints.has(index)) {
        const info = endpoints.get(index);
        const dot = document.createElement("div");
        dot.className = "endpoint";
        dot.style.setProperty("--color", info.color);
        cell.appendChild(dot);
      }

      board.appendChild(cell);
    }

    renderLines();
  }

  function renderLines() {
    svg.innerHTML = "";

    paths.forEach(path => {
      if (path.cells.length < 2) return;

      const points = path.cells.map(index => {
        const row = Math.floor(index / size);
        const col = index % size;
        return `${col + .5},${row + .5}`;
      });

      const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      line.setAttribute("points", points.join(" "));
      line.setAttribute("stroke", path.color);
      line.setAttribute("class", "path-line");
      line.style.color = path.color;
      svg.appendChild(line);
    });

    if (drawing && drawing.cells.length > 1) {
      const points = drawing.cells.map(index => {
        const row = Math.floor(index / size);
        const col = index % size;
        return `${col + .5},${row + .5}`;
      });

      const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      line.setAttribute("points", points.join(" "));
      line.setAttribute("stroke", drawing.color);
      line.setAttribute("class", "path-line preview");
      line.style.color = drawing.color;
      svg.appendChild(line);
    }

    board.querySelectorAll(".endpoint").forEach(dot => dot.classList.remove("connected"));

    paths.forEach(path => {
      if (!path.complete) return;

      [path.start, path.end].forEach(index => {
        const cell = board.querySelector(`[data-index="${index}"]`);
        const dot = cell && cell.querySelector(".endpoint");
        if (dot) dot.classList.add("connected");
      });
    });

    board.querySelectorAll(".cell").forEach(cell => cell.classList.remove("path-filled"));

    const filled = new Set();
    paths.forEach(path => {
      if (path.complete) path.cells.forEach(index => filled.add(index));
    });
    if (drawing) drawing.cells.forEach(index => filled.add(index));

    filled.forEach(index => {
      const cell = board.querySelector(`[data-index="${index}"]`);
      if (cell) cell.classList.add("path-filled");
    });
  }

  function rebuildOccupied() {
    occupied = new Map();

    paths.forEach(path => {
      if (!path.complete) return;
      path.cells.forEach(cell => occupied.set(cell, path.index));
    });
  }

  function cellFromPointer(event) {
    const rect = board.getBoundingClientRect();
    const col = Math.floor((event.clientX - rect.left) / rect.width * size);
    const row = Math.floor((event.clientY - rect.top) / rect.height * size);

    if (row < 0 || col < 0 || row >= size || col >= size) return null;
    return row * size + col;
  }

  function adjacent(a, b) {
    const rowA = Math.floor(a / size);
    const colA = a % size;
    const rowB = Math.floor(b / size);
    const colB = b % size;

    return Math.abs(rowA - rowB) + Math.abs(colA - colB) === 1;
  }

  function beginDrawing(cell) {
    const endpoint = endpoints.get(cell);
    if (!endpoint) return false;

    const path = paths[endpoint.pathIndex];

    if (path.complete) {
      path.complete = false;
      path.cells = [];
      rebuildOccupied();
    }

    drawing = {
      pathIndex: path.index,
      color: path.color,
      start: cell,
      cells: [cell]
    };

    renderLines();
    return true;
  }

  function extendDrawing(target) {
    if (!drawing || target === null) return;

    const current = drawing.cells[drawing.cells.length - 1];
    if (target === current) return;

    const previousPosition = drawing.cells.indexOf(target);

    if (previousPosition !== -1) {
      drawing.cells = drawing.cells.slice(0, previousPosition + 1);
      renderLines();
      return;
    }

    if (!adjacent(current, target)) return;

    const endpoint = endpoints.get(target);
    if (endpoint && endpoint.pathIndex !== drawing.pathIndex) return;

    const owner = occupied.get(target);
    if (owner !== undefined && owner !== drawing.pathIndex) return;

    drawing.cells.push(target);

    if (endpoint && endpoint.pathIndex === drawing.pathIndex) {
      const path = paths[drawing.pathIndex];

      if ((target === path.start || target === path.end) && target !== drawing.start) {
        path.cells = [...drawing.cells];
        path.complete = true;
        drawing = null;
        rebuildOccupied();
        renderLines();
        checkComplete();
        return;
      }
    }

    renderLines();
  }

  function finishDrawing() {
    if (!drawing) return;

    const path = paths[drawing.pathIndex];
    const last = drawing.cells[drawing.cells.length - 1];

    if ((last === path.start || last === path.end) && last !== drawing.start) {
      path.cells = [...drawing.cells];
      path.complete = true;
      rebuildOccupied();
    }

    drawing = null;
    renderLines();
    checkComplete();
  }

  function allCellsCovered() {
    const filled = new Set();

    paths.forEach(path => {
      if (path.complete) path.cells.forEach(cell => filled.add(cell));
    });

    return filled.size === size * size;
  }

  function checkComplete() {
    const allConnected = paths.every(path => path.complete);
    const covered = allCellsCovered();

    if (allConnected && covered) {
      message.classList.remove("visible");
      spaceMessage.classList.remove("visible");
      message.dataset.show = "false";
      winLevel();
    } else if (allConnected && !covered) {
      showSpaceMessage();
    }
  }

  function winLevel() {
    locked = true;

    completed = Math.max(completed, Math.min(level, TOTAL_LEVELS));
    localStorage.setItem(PROGRESS_KEY, String(completed));

    if (completed >= TOTAL_LEVELS) {
      saveReward();
      winTitle.textContent = "YAY";
      winSubtitle.textContent = "";
      nextButton.textContent = "next";
    } else {
      winTitle.textContent = "YAY";
      winSubtitle.textContent = "";
      nextButton.textContent = "next";
    }

    updateProgress();
    win.classList.add("show");
  }

  function startLevel() {
    locked = false;
    drawing = null;
    win.classList.remove("show");
    message.classList.remove("visible");
    spaceMessage.classList.remove("visible");
    message.dataset.show = "false";
    clearTimeout(messageTimer);

    makeSolution();
    rebuildOccupied();
    renderBoard();
    updateProgress();
  }

  boardWrap.addEventListener("pointerdown", event => {
    if (locked) return;

    const cell = cellFromPointer(event);
    if (cell === null || !endpoints.has(cell)) return;

    event.preventDefault();

    try {
      boardWrap.setPointerCapture(event.pointerId);
    } catch {}

    beginDrawing(cell);
  });

  boardWrap.addEventListener("pointermove", event => {
    if (locked || !drawing) return;

    const target = cellFromPointer(event);
    if (target === null) return;

    let current = drawing.cells[drawing.cells.length - 1];

    while (current !== target) {
      const row = Math.floor(current / size);
      const col = current % size;
      const targetRow = Math.floor(target / size);
      const targetCol = target % size;

      let next;
      const dx = Math.abs(targetCol - col);
      const dy = Math.abs(targetRow - row);

      if (dx >= dy && col !== targetCol) {
        next = current + (targetCol > col ? 1 : -1);
      } else if (row !== targetRow) {
        next = current + (targetRow > row ? size : -size);
      } else if (col !== targetCol) {
        next = current + (targetCol > col ? 1 : -1);
      } else {
        break;
      }

      if (!adjacent(current, next)) break;

      const oldLength = drawing.cells.length;
      extendDrawing(next);

      if (!drawing) return;

      const newCurrent = drawing.cells[drawing.cells.length - 1];

      if (drawing.cells.length === oldLength && newCurrent === current) break;
      current = newCurrent;
    }
  });

  boardWrap.addEventListener("pointerup", finishDrawing);
  boardWrap.addEventListener("pointercancel", finishDrawing);

  document.getElementById("restartButton").addEventListener("click", startLevel);

  document.getElementById("returnButton").addEventListener("click", () => {
    window.location.href = RETURN_PAGE;
  });

  nextButton.addEventListener("click", () => {
    win.classList.remove("show");
    level++;
    startLevel();
  });

  if (completed >= TOTAL_LEVELS) saveReward();

  makeStars();
  startLevel();
})();
</script>
</body>
</html>
