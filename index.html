
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080d18">
    <title>♡</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            height: 100%;
            background: #080d18;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            overscroll-behavior: none;
            background:
                radial-gradient(ellipse at 50% 45%, #142642 0%, #0d192d 45%, #080d18 100%);
            color: #dce8fa;
            font-family: 'Quicksand', sans-serif;
        }

        /* Animated background */

        .star-background {
            position: absolute;
            inset: -12%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 25%, rgba(64,104,165,0.13), transparent 35%),
                radial-gradient(circle at 80% 75%, rgba(60,100,165,0.12), transparent 38%);
        }

        .star {
            position: absolute;
            display: block;
            color: #a9caff;
            user-select: none;
            will-change: transform, opacity;
            animation:
                drift var(--duration) ease-in-out infinite alternate,
                twinkle var(--twinkle) ease-in-out infinite alternate;
            animation-delay: var(--delay), var(--delay);
        }

        .star.small {
            font-family: 'Cormorant Garamond', serif;
            font-size: var(--size);
            opacity: 0.45;
        }

        .star.large {
            font-family: 'Cormorant Garamond', serif;
            font-size: var(--size);
            color: rgba(137,178,239,0.28);
        }

        .star.dot {
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background: #b9d5ff;
            box-shadow: 0 0 8px rgba(135,180,255,0.5);
        }

        @keyframes drift {
            from {
                transform: translate3d(-12px, 8px, 0) rotate(-12deg);
            }
            to {
                transform: translate3d(18px, -22px, 0) rotate(18deg);
            }
        }

        @keyframes twinkle {
            from {
                opacity: 0.2;
            }
            to {
                opacity: 0.85;
            }
        }

        /* Floating decorative stars */

        .floating-star {
            position: absolute;
            z-index: 0;
            pointer-events: none;
            color: rgba(150,190,255,0.28);
            font-family: 'Cormorant Garamond', serif;
            line-height: 1;
            animation: float 7s ease-in-out infinite alternate;
        }

        .floating-star.one {
            top: 12%;
            left: 8%;
            font-size: 58px;
            animation-delay: -2s;
        }

        .floating-star.two {
            top: 23%;
            right: 9%;
            font-size: 36px;
            animation-delay: -4s;
        }

        .floating-star.three {
            bottom: 12%;
            left: 13%;
            font-size: 42px;
            animation-delay: -1s;
        }

        .floating-star.four {
            bottom: 16%;
            right: 11%;
            font-size: 65px;
            animation-delay: -3s;
        }

        @keyframes float {
            from {
                transform: translate3d(-8px, 10px, 0) rotate(-10deg);
            }
            to {
                transform: translate3d(12px, -18px, 0) rotate(15deg);
            }
        }

        /* Page */

        .page {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            height: 100dvh;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding:
                max(60px, env(safe-area-inset-top))
                20px
                max(25px, env(safe-area-inset-bottom));
        }

        .inventory-button {
            position: absolute;
            z-index: 5;
            top: max(18px, env(safe-area-inset-top));
            right: max(18px, env(safe-area-inset-right));
            padding: 11px 20px;
            border: 1px solid rgba(180,210,255,0.3);
            border-radius: 50px;
            background: rgba(15,28,50,0.78);
            color: #dce8fa;
            font-family: 'Quicksand', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-decoration: none;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .inventory-button:hover {
            background: rgba(65,105,165,0.4);
            transform: translateY(-2px);
        }

        .ornament {
            font-family: 'Cormorant Garamond', serif;
            color: #799acb;
            font-size: 20px;
            letter-spacing: 10px;
            margin-bottom: 12px;
            animation: softGlow 4s ease-in-out infinite alternate;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(42px, 8vw, 70px);
            font-weight: 500;
            color: #e1ecff;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 19px;
            color: #8ca9d6;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-align: center;
        }

        .game-container {
            width: min(460px, 100%);
            padding: 25px;
            background: rgba(14,25,44,0.76);
            border: 1px solid rgba(180,210,255,0.18);
            border-radius: 28px;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.25),
                inset 0 0 30px rgba(130,175,255,0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .games {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 21px 22px;
            border: 1px solid rgba(165,200,255,0.2);
            border-radius: 18px;
            background: linear-gradient(
                135deg,
                rgba(54,83,130,0.24),
                rgba(15,29,51,0.65)
            );
            color: #e0eaff;
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 500;
            letter-spacing: 1px;
            text-decoration: none;
            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .game-button:hover {
            transform: translateY(-3px);
            border-color: rgba(165,200,255,0.55);
            background: linear-gradient(
                135deg,
                rgba(65,105,165,0.4),
                rgba(20,38,66,0.85)
            );
            box-shadow: 0 10px 25px rgba(0,0,0,0.18);
        }

        .game-button span:last-child {
            color: #7799cc;
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
        }

        .bottom-ornament {
            margin-top: 30px;
            color: #799acb;
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            letter-spacing: 12px;
            animation: softGlow 4s ease-in-out infinite alternate;
        }

        @keyframes softGlow {
            from {
                opacity: 0.55;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .page {
                padding:
                    max(65px, env(safe-area-inset-top))
                    18px
                    max(25px, env(safe-area-inset-bottom));
            }

            .floating-star.one {
                top: 12%;
                left: 3%;
                font-size: 42px;
            }

            .floating-star.two {
                top: 28%;
                right: 4%;
                font-size: 28px;
            }

            .floating-star.three {
                bottom: 12%;
                left: 5%;
                font-size: 32px;
            }

            .floating-star.four {
                bottom: 10%;
                right: 4%;
                font-size: 45px;
            }

            .game-container {
                padding: 15px;
                border-radius: 22px;
            }

            .game-button {
                padding: 19px 17px;
                font-size: 24px;
                border-radius: 15px;
            }

            .subtitle {
                font-size: 17px;
                letter-spacing: 2px;
                margin-bottom: 28px;
            }

            .bottom-ornament {
                margin-top: 22px;
            }
        }

        @media (max-height: 600px) {
            .page {
                padding-top: 55px;
                padding-bottom: 12px;
            }

            .ornament {
                margin-bottom: 4px;
                font-size: 16px;
            }

            h1 {
                font-size: 42px;
            }

            .subtitle {
                margin-bottom: 15px;
                font-size: 16px;
            }

            .game-container {
                padding: 14px;
            }

            .games {
                gap: 10px;
            }

            .game-button {
                padding: 13px 17px;
                font-size: 22px;
            }

            .bottom-ornament {
                margin-top: 12px;
                font-size: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .star,
            .floating-star,
            .ornament,
            .bottom-ornament {
                animation: none;
            }

            .game-button,
            .inventory-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div class="star-background" id="starBackground" aria-hidden="true"></div>

    <div class="floating-star one" aria-hidden="true">✦</div>
    <div class="floating-star two" aria-hidden="true">✧</div>
    <div class="floating-star three" aria-hidden="true">✧</div>
    <div class="floating-star four" aria-hidden="true">✦</div>

    <a href="inventory.html" class="inventory-button">inventory</a>

    <main class="page">

        <div class="ornament">✦　⋆　✦</div>

        <h1>♡</h1>

        <div class="subtitle">✧　choose a game　✧</div>

        <section class="game-container">
            <div class="games">
                <a href="watersort.html" class="game-button">
                    <span>watersort</span>
                    <span>↗</span>
                </a>

                <a href="colormatch.html" class="game-button">
                    <span>colormatch</span>
                    <span>↗</span>
                </a>
            </div>
        </section>

        <div class="bottom-ornament">✧　·　✦　·　✧</div>

    </main>

    <script>
        const background = document.getElementById("starBackground");

        const symbols = ["✦", "✧", "⋆", "·"];
        const starCount = 42;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement("span");

            const type = Math.random();
            star.className = "star";

            if (type < 0.25) {
                star.classList.add("large");
                star.textContent = symbols[Math.floor(Math.random() * 3)];
            } else if (type < 0.55) {
                star.classList.add("small");
                star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            } else {
                star.classList.add("dot");
            }

            const size = type > 0.55
                ? (Math.random() * 2 + 1) + "px"
                : (Math.random() * 18 + 8) + "px";

            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";
            star.style.setProperty("--size", size);
            star.style.setProperty("--duration", (5 + Math.random() * 9) + "s");
            star.style.setProperty("--twinkle", (2 + Math.random() * 4) + "s");
            star.style.setProperty("--delay", (-Math.random() * 10) + "s");

            background.appendChild(star);
        }
    </script>

</body>
</html>
