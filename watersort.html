<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #080d18;
}

html {
  overflow-x: hidden;
  overscroll-behavior: none;
}

body {
  min-height: 100dvh;
  position: relative;
  isolation: isolate;
  overflow-x: hidden;
  background: radial-gradient(ellipse at 50% 45%, #142642 0%, #0d192d 45%, #080d18 100%);
  color: #dce8fa;
  font-family: 'Quicksand', sans-serif;
}

.star-background {
  position: fixed;
  inset: -12%;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(circle at 20% 25%, rgba(64,104,165,.13), transparent 35%),
    radial-gradient(circle at 80% 75%, rgba(60,100,165,.12), transparent 38%);
}

.star {
  position: absolute;
  display: block;
  color: #a9caff;
  user-select: none;
  pointer-events: none;
  will-change: transform, opacity;
  animation: drift var(--duration) ease-in-out infinite alternate,
             twinkle var(--twinkle) ease-in-out infinite alternate;
  animation-delay: var(--delay), var(--delay);
}

.star.small, .star.large {
  font-family: 'Cormorant Garamond', serif;
}

.star.small {
  font-size: var(--size);
  opacity: .45;
}

.star.large {
  font-size: var(--size);
  color: rgba(137,178,239,.28);
}

.star.dot {
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: #b9d5ff;
  box-shadow: 0 0 8px rgba(135,180,255,.5);
}

@keyframes drift {
  from { transform: translate3d(-12px, 8px, 0) rotate(-12deg); }
  to { transform: translate3d(18px, -22px, 0) rotate(18deg); }
}

@keyframes twinkle {
  from { opacity: .2; }
  to { opacity: .85; }
}

.floating-star {
  position: fixed;
  z-index: 0;
  pointer-events: none;
  color: rgba(150,190,255,.28);
  font-family: 'Cormorant Garamond', serif;
  line-height: 1;
  animation: float 7s ease-in-out infinite alternate;
}

.floating-star.one {
  top: 12%;
  left: 8%;
  font-size: 58px;
  animation-delay: -2s;
}

.floating-star.two {
  top: 23%;
  right: 9%;
  font-size: 36px;
  animation-delay: -4s;
}

.floating-star.three {
  bottom: 12%;
  left: 13%;
  font-size: 42px;
  animation-delay: -1s;
}

.floating-star.four {
  bottom: 16%;
  right: 11%;
  font-size: 65px;
  animation-delay: -3s;
}

@keyframes float {
  from { transform: translate3d(-8px, 10px, 0) rotate(-10deg); }
  to { transform: translate3d(12px, -18px, 0) rotate(15deg); }
}

header {
  position: relative;
  z-index: 2;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 10px max(18px, env(safe-area-inset-left));
}

.nav-button {
  padding: 11px 20px;
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 50px;
  background: rgba(15,28,50,.78);
  color: #dce8fa;
  font-family: 'Quicksand', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: background .25s ease, transform .25s ease;
}

.nav-button:hover {
  background: rgba(65,105,165,.4);
  transform: translateY(-2px);
}

main {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: calc(100dvh - 65px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 18px 18px max(28px, env(safe-area-inset-bottom));
}

.ornament {
  color: #799acb;
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px;
  letter-spacing: 10px;
  margin-bottom: 10px;
  animation: softGlow 4s ease-in-out infinite alternate;
}

h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(38px, 8vw, 60px);
  font-weight: 500;
  color: #e1ecff;
  letter-spacing: 2px;
  margin-bottom: 25px;
  text-align: center;
}

.progress-wrap {
  width: min(390px, 88%);
  margin: 0 auto 32px;
  text-align: center;
}

.unlock-message {
  min-height: 28px;
  margin-bottom: 11px;
  color: #b9d3ff;
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(17px, 4.5vw, 22px);
  letter-spacing: 1px;
  opacity: 0;
  transform: translateY(5px);
  transition: opacity .45s ease, transform .45s ease;
}

.unlock-message.visible {
  opacity: 1;
  transform: translateY(0);
}

.progress-track {
  position: relative;
  width: 100%;
  height: 4px;
  overflow: hidden;
  border-radius: 20px;
  background: rgba(137,178,239,.16);
  box-shadow: 0 0 12px rgba(82,139,220,.08);
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #527dbd, #8fc1ff);
  box-shadow: 0 0 12px rgba(119,174,255,.55);
  transition: width .8s cubic-bezier(.22,.8,.25,1);
}

.game-container {
  width: min(540px, 100%);
  padding: clamp(18px, 4vw, 28px);
  background: rgba(14,25,44,.76);
  border: 1px solid rgba(180,210,255,.18);
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25), inset 0 0 30px rgba(130,175,255,.04);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

#bottles {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  align-content: center;
  flex-wrap: wrap;
  gap: clamp(19px, 4vw, 30px) clamp(13px, 3.4vw, 23px);
}

.bottle {
  position: relative;
  width: clamp(43px, 9.5vw, 61px);
  height: clamp(133px, 29vw, 174px);
  flex-shrink: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  cursor: pointer;
  transition: transform .22s ease;
}

.bottle.selected {
  transform: translateY(-10px);
}

.bottle-shell {
  position: absolute;
  inset: 0 2px 0;
  overflow: hidden;
  border: 2px solid rgba(174,205,255,.62);
  border-top: 0;
  border-radius: 5px 5px 17px 17px;
  background: linear-gradient(90deg, rgba(255,255,255,.09), rgba(255,255,255,.012) 30%, rgba(255,255,255,.02) 70%, rgba(255,255,255,.09));
  box-shadow: inset 0 0 12px rgba(115,171,255,.07);
}

.bottle-shell::before {
  content: "";
  position: absolute;
  z-index: 4;
  top: 0;
  left: -2px;
  right: -2px;
  height: 8px;
  border: 2px solid rgba(174,205,255,.72);
  border-radius: 5px;
  background: rgba(13,25,45,.9);
}

.liquid {
  position: absolute;
  z-index: 1;
  left: 2px;
  right: 2px;
  top: 8px;
  bottom: 2px;
  display: flex;
  flex-direction: column-reverse;
  overflow: hidden;
  border-radius: 0 0 13px 13px;
}

.segment {
  position: relative;
  flex: 0 0 25%;
  width: 100%;
  min-height: 0;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}

.segment.top-liquid::after {
  content: "";
  position: absolute;
  top: -2px;
  left: -1px;
  right: -1px;
  height: 6px;
  border-radius: 50%;
  background: inherit;
  filter: brightness(1.08);
}

.shine {
  position: absolute;
  z-index: 5;
  top: 13px;
  bottom: 12px;
  left: 6px;
  width: 3px;
  border-radius: 8px;
  background: rgba(255,255,255,.14);
  pointer-events: none;
}

.bottom-ornament {
  margin-top: 26px;
  color: #799acb;
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  letter-spacing: 12px;
  animation: softGlow 4s ease-in-out infinite alternate;
}

@keyframes softGlow {
  from { opacity: .55; }
  to { opacity: 1; }
}

.modal-overlay {
  position: fixed;
  z-index: 10;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(3,7,17,.78);
  padding: 20px;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  width: min(100%, 330px);
  padding: 30px 24px;
  text-align: center;
  background: rgba(14,25,44,.96);
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 0 30px rgba(130,175,255,.04);
  backdrop-filter: blur(12px);
}

.modal-title {
  margin: 0 0 24px;
  color: #e1ecff;
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px;
  font-weight: 500;
  letter-spacing: 3px;
}

.next-button {
  min-width: 120px;
  padding: 11px 20px;
  border: 1px solid rgba(180,210,255,.3);
  border-radius: 50px;
  background: rgba(45,76,122,.65);
  color: #e0eaff;
  font-family: 'Quicksand', sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: background .25s ease, transform .25s ease;
}

.next-button:hover {
  background: rgba(65,105,165,.55);
  transform: translateY(-2px);
}

@media (max-width: 420px) {
  .floating-star.one { left: 3%; font-size: 42px; }
  .floating-star.two { right: 4%; font-size: 28px; }
  .floating-star.three { left: 5%; font-size: 32px; }
  .floating-star.four { right: 4%; font-size: 45px; }
  .game-container { padding: 17px 12px; border-radius: 22px; }
  #bottles { gap: 18px 12px; }
  .bottom-ornament { margin-top: 22px; }
}

@media (max-height: 650px) {
  main { padding-top: 10px; }
  .ornament { margin-bottom: 3px; font-size: 16px; }
  h1 { font-size: 38px; margin-bottom: 12px; }
  .progress-wrap { margin-bottom: 18px; }
  .game-container { padding: 14px; }
  .bottom-ornament { margin-top: 13px; font-size: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .star, .floating-star, .ornament, .bottom-ornament {
    animation: none;
  }
  .nav-button, .next-button, .progress-fill, .bottle {
    transition: none;
  }
}
</style>
</head>
<body>

<div class="star-background" id="starBackground" aria-hidden="true"></div>
<div class="floating-star one" aria-hidden="true">✦</div>
<div class="floating-star two" aria-hidden="true">✧</div>
<div class="floating-star three" aria-hidden="true">✧</div>
<div class="floating-star four" aria-hidden="true">✦</div>

<header>
  <button class="nav-button" id="returnButton" type="button">return</button>
  <button class="nav-button" id="restartButton" type="button">restart</button>
</header>

<main>
  <div class="ornament">✦　⋆　✦</div>
  <h1>♡</h1>

  <div class="progress-wrap">
    <div class="unlock-message" id="unlockMessage">yayyy you unlocked the letters</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <section class="game-container">
    <div id="bottles"></div>
  </section>

  <div class="bottom-ornament">✧　·　✦　·　✧</div>
</main>

<div class="modal-overlay" id="winModal">
  <div class="modal">
    <h2 class="modal-title" id="modalTitle">YAY</h2>
    <button class="next-button" id="nextButton" type="button">next</button>
  </div>
</div>

<script>
  (() => {
  const UNLOCK_LEVEL = 10;
  const REWARD_KEY = "birthday_unlocked_rewards";
  const PROGRESS_KEY = "watersort_completed_levels";
  const RETURN_PAGE = "index.html";

  const colors = [
    "#ff668a", "#69c8ff", "#b18aff", "#ffd166",
    "#62dfbd", "#ff9c66", "#f28ce5", "#8ca8ff",
    "#c6e879", "#ff7b73", "#69e0e8", "#d5a0ff"
  ];

  const bottlesElement = document.getElementById("bottles");
  const progressFill = document.getElementById("progressFill");
  const unlockMessage = document.getElementById("unlockMessage");
  const winModal = document.getElementById("winModal");
  const modalTitle = document.getElementById("modalTitle");
  const nextButton = document.getElementById("nextButton");

  let completedLevels = Number(localStorage.getItem(PROGRESS_KEY)) || 0;
  completedLevels = Math.max(0, completedLevels);

  let level = completedLevels + 1;
  let bottles = [];
  let selectedBottle = null;
  let locked = false;
  let audioContext = null;

  function readRewards() {
    try {
      const rewards = JSON.parse(localStorage.getItem(REWARD_KEY) || "[]");
      return Array.isArray(rewards) ? rewards : [];
    } catch {
      return [];
    }
  }

  function unlockLetters() {
    const rewards = readRewards();

    if (!rewards.includes("letters")) {
      rewards.push("letters");
      localStorage.setItem(REWARD_KEY, JSON.stringify(rewards));
    }
  }

  function isUnlocked() {
    return completedLevels >= UNLOCK_LEVEL ||
      readRewards().includes("letters");
  }

function updateProgress() {
  const progress = Math.min(completedLevels / UNLOCK_LEVEL, 1);

  progressFill.style.width = `${progress * 100}%`;

  const unlocked = completedLevels >= UNLOCK_LEVEL;

  unlockMessage.classList.toggle("visible", unlocked);

  if (unlocked) {
    unlockLetters();
  }
      }

  function playSound(frequency = 520, duration = 0.09, volume = 0.035) {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === "suspended") audioContext.resume();

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(120, frequency * 0.72),
        audioContext.currentTime + duration
      );

      gain.gain.setValueAtTime(volume, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    } catch {
      // Sound is optional if the browser blocks audio.
    }
  }

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function createLevel() {
    selectedBottle = null;
    locked = false;

    const colorCount = Math.min(
      3 + Math.floor((level - 1) / 2),
      colors.length
    );

    const chosenColors = colors.slice(0, colorCount);
    const units = [];

    chosenColors.forEach(color => {
      for (let i = 0; i < 4; i++) {
        units.push({ color });
      }
    });

    shuffle(units);
    bottles = [];

    for (let i = 0; i < colorCount; i++) {
      bottles.push(units.slice(i * 4, (i + 1) * 4));
    }

    bottles.push([]);
    bottles.push([]);

    renderBottles();
    updateProgress();
  }

  function renderBottles() {
    bottlesElement.innerHTML = "";

    bottles.forEach((bottle, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "bottle";
      button.setAttribute("aria-label", "Bottle");

      if (selectedBottle === index) {
        button.classList.add("selected");
      }

      const shell = document.createElement("div");
      shell.className = "bottle-shell";

      const liquid = document.createElement("div");
      liquid.className = "liquid";

      bottle.forEach((unit, unitIndex) => {
        const segment = document.createElement("div");
        segment.className = "segment";
        segment.style.backgroundColor = unit.color;

        if (unitIndex === bottle.length - 1) {
          segment.classList.add("top-liquid");
        }

        liquid.appendChild(segment);
      });

      const shine = document.createElement("div");
      shine.className = "shine";

      shell.appendChild(liquid);
      shell.appendChild(shine);
      button.appendChild(shell);

      button.addEventListener("click", () => handleBottleClick(index));
      bottlesElement.appendChild(button);
    });
  }

  function canPour(fromIndex, toIndex) {
    if (fromIndex === toIndex) return false;

    const from = bottles[fromIndex];
    const to = bottles[toIndex];

    if (!from || from.length === 0 || to.length >= 4) return false;
    if (to.length === 0) return true;

    return from[from.length - 1].color === to[to.length - 1].color;
  }

  function handleBottleClick(index) {
    if (locked) return;

    if (selectedBottle === null) {
      if (bottles[index].length > 0) {
        selectedBottle = index;
        playSound(430, 0.055, 0.018);
        renderBottles();
      }
      return;
    }

    if (selectedBottle === index) {
      selectedBottle = null;
      renderBottles();
      return;
    }

    if (canPour(selectedBottle, index)) {
      pourWater(selectedBottle, index);
      return;
    }

    if (bottles[index].length > 0) {
      selectedBottle = index;
      playSound(430, 0.055, 0.018);
    } else {
      selectedBottle = null;
    }

    renderBottles();
  }

  function pourWater(fromIndex, toIndex) {
    const from = bottles[fromIndex];
    const to = bottles[toIndex];
    const topColor = from[from.length - 1].color;

    while (
      from.length > 0 &&
      from[from.length - 1].color === topColor &&
      to.length < 4
    ) {
      to.push(from.pop());
    }

    selectedBottle = null;
    playSound(600, 0.12, 0.025);
    renderBottles();

    if (checkWin()) {
      showWin();
    }
  }

  function checkWin() {
    return bottles.every(bottle => {
      if (bottle.length === 0) return true;
      if (bottle.length !== 4) return false;

      return bottle.every(unit => unit.color === bottle[0].color);
    });
  }

  function showWin() {
    locked = true;

    completedLevels = Math.max(completedLevels, level);
    localStorage.setItem(PROGRESS_KEY, String(completedLevels));

    if (completedLevels >= UNLOCK_LEVEL) {
      unlockLetters();
      unlockMessage.classList.add("visible");
    }

    updateProgress();

    modalTitle.textContent = "YAY";
    winModal.classList.add("show");

    playSound(660, 0.18, 0.035);
    setTimeout(() => playSound(880, 0.22, 0.025), 110);
  }

  function nextLevel() {
    winModal.classList.remove("show");
    level++;
    createLevel();
  }

  document.getElementById("restartButton").addEventListener("click", () => {
    winModal.classList.remove("show");
    createLevel();
    playSound(430, 0.07, 0.02);
  });

  document.getElementById("returnButton").addEventListener("click", () => {
    window.location.href = RETURN_PAGE;
  });

  nextButton.addEventListener("click", nextLevel);

  const background = document.getElementById("starBackground");
  const symbols = ["✦", "✧", "⋆", "·"];

  for (let i = 0; i < 42; i++) {
    const star = document.createElement("span");
    const type = Math.random();

    star.className = "star";

    if (type < 0.25) {
      star.classList.add("large");
      star.textContent = symbols[Math.floor(Math.random() * 3)];
    } else if (type < 0.55) {
      star.classList.add("small");
      star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    } else {
      star.classList.add("dot");
    }

    const size = type > 0.55
      ? (Math.random() * 2 + 1) + "px"
      : (Math.random() * 18 + 8) + "px";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.setProperty("--size", size);
    star.style.setProperty("--duration", (5 + Math.random() * 9) + "s");
    star.style.setProperty("--twinkle", (2 + Math.random() * 4) + "s");
    star.style.setProperty("--delay", (-Math.random() * 10) + "s");

    background.appendChild(star);
  }

  updateProgress();
  createLevel();
})();
</script>
</body>
</html>
